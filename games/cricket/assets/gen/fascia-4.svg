<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 128" width="2048" height="128">
  <defs>
    <!-- 5-Point Stars -->
    <polygon id="star-lg" points="0,-15 3.5,-5.0 14.3,-4.6 5.8,1.9 8.8,12.2 0,6.1 -8.8,12.2 -5.8,1.9 -14.3,-4.6 -3.5,-5.0" fill="#ffffff" stroke="#0a1931" stroke-width="2"/>
    <polygon id="star-md" points="0,-10 2.5,-3.4 9.5,-3.1 3.9,1.3 5.9,8.1 0,4.1 -5.9,8.1 -3.9,1.3 -9.5,-3.1 -2.5,-3.4" fill="#ffffff" stroke="#0a1931" stroke-width="1.5"/>
    <polygon id="star-sm" points="0,-6 1.5,-2.0 5.7,-1.9 2.3,0.8 3.5,4.9 0,2.5 -3.5,4.9 -2.3,0.8 -5.7,-1.9 -1.5,-2.0" fill="#ffffff" stroke="#0a1931" stroke-width="1.2"/>
    <polygon id="star-gold-sm" points="0,-6 1.5,-2.0 5.7,-1.9 2.3,0.8 3.5,4.9 0,2.5 -3.5,4.9 -2.3,0.8 -5.7,-1.9 -1.5,-2.0" fill="#ffd21f" stroke="#0a1931" stroke-width="1"/>

    <!-- Primary Cricket Crest Shield (Stumps, Crossed Bats, Ball) -->
    <g id="cricket-crest">
      <!-- Shield Drop Shadow -->
      <path d="M 0,-47 L 50,-32 L 40,20 Q 30,46 0,57 Q -30,46 -40,20 L -50,-32 Z" fill="#061021"/>
      <!-- Shield Navy Base -->
      <path d="M 0,-49 L 48,-34 L 38,18 Q 28,44 0,55 Q -28,44 -38,18 L -48,-34 Z" fill="#0a1931" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- Gold Inner Inset -->
      <path d="M 0,-43 L 41,-30 L 33,16 Q 24,39 0,49 Q -24,39 -33,16 L -41,-30 Z" fill="none" stroke="#ffd21f" stroke-width="1.5"/>

      <!-- Crossed Bats -->
      <g transform="rotate(-33)">
        <rect x="-2.5" y="-38" width="5" height="20" rx="1.5" fill="#ffffff" stroke="#0a1931" stroke-width="1"/>
        <line x1="-2.5" y1="-32" x2="2.5" y2="-32" stroke="#0a1931" stroke-width="1"/>
        <line x1="-2.5" y1="-26" x2="2.5" y2="-26" stroke="#0a1931" stroke-width="1"/>
        <path d="M -5,-18 L 5,-18 L 4.5,28 Q 4.5,33 0,33 Q -4.5,33 -4.5,28 Z" fill="#f8fafc" stroke="#0a1931" stroke-width="1.2"/>
        <line x1="0" y1="-16" x2="0" y2="29" stroke="#cbd5e1" stroke-width="1"/>
      </g>
      <g transform="rotate(33)">
        <rect x="-2.5" y="-38" width="5" height="20" rx="1.5" fill="#ffffff" stroke="#0a1931" stroke-width="1"/>
        <line x1="-2.5" y1="-32" x2="2.5" y2="-32" stroke="#0a1931" stroke-width="1"/>
        <line x1="-2.5" y1="-26" x2="2.5" y2="-26" stroke="#0a1931" stroke-width="1"/>
        <path d="M -5,-18 L 5,-18 L 4.5,28 Q 4.5,33 0,33 Q -4.5,33 -4.5,28 Z" fill="#f8fafc" stroke="#0a1931" stroke-width="1.2"/>
        <line x1="0" y1="-16" x2="0" y2="29" stroke="#cbd5e1" stroke-width="1"/>
      </g>

      <!-- 3 Stumps and Bails -->
      <g transform="translate(0, -3)">
        <rect x="-17" y="-23" width="16" height="3" rx="1" fill="#ffd21f" stroke="#0a1931" stroke-width="0.8"/>
        <rect x="1" y="-23" width="16" height="3" rx="1" fill="#ffd21f" stroke="#0a1931" stroke-width="0.8"/>
        <rect x="-15" y="-20" width="4.5" height="42" rx="1" fill="#ffffff" stroke="#0a1931" stroke-width="1"/>
        <rect x="-2.25" y="-20" width="4.5" height="42" rx="1" fill="#ffffff" stroke="#0a1931" stroke-width="1"/>
        <rect x="10.5" y="-20" width="4.5" height="42" rx="1" fill="#ffffff" stroke="#0a1931" stroke-width="1"/>
      </g>

      <!-- Cricket Ball in Foreground -->
      <circle cx="0" cy="18" r="14" fill="#d31b28" stroke="#0a1931" stroke-width="2"/>
      <path d="M -9,9 A 14,14 0 0,1 9,27" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="2.5,1.5"/>
      <circle cx="-3" cy="14" r="3.5" fill="#ef4444" opacity="0.6"/>

      <!-- Top Accent Star -->
      <use href="#star-gold-sm" x="0" y="-35"/>
    </g>

    <!-- Secondary Motif: Cricket Ball with Dynamic Broadcast Chevrons -->
    <g id="chevrons-ball">
      <!-- Left Chevrons -->
      <path d="M -24,-16 L -32,-16 L -40,0 L -32,16 L -24,16 L -32,0 Z" fill="#0a1931"/>
      <path d="M -36,-16 L -44,-16 L -52,0 L -44,16 L -36,16 L -44,0 Z" fill="#ffffff" stroke="#0a1931" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M -48,-16 L -56,-16 L -64,0 L -56,16 L -48,16 L -56,0 Z" fill="#0a1931"/>
      <!-- Right Chevrons -->
      <path d="M 24,-16 L 32,-16 L 40,0 L 32,16 L 24,16 L 32,0 Z" fill="#0a1931"/>
      <path d="M 36,-16 L 44,-16 L 52,0 L 44,16 L 36,16 L 44,0 Z" fill="#ffffff" stroke="#0a1931" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M 48,-16 L 56,-16 L 64,0 L 56,16 L 48,16 L 56,0 Z" fill="#0a1931"/>
      <!-- Center Cricket Ball -->
      <circle cx="0" cy="0" r="17" fill="#061021"/>
      <circle cx="0" cy="0" r="16" fill="#d31b28" stroke="#0a1931" stroke-width="2"/>
      <path d="M -10,-10 A 16,16 0 0,1 10,10" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="2.5,1.5"/>
      <!-- Upper and Lower Mini Stars -->
      <use href="#star-sm" x="0" y="-24"/>
      <use href="#star-sm" x="0" y="24"/>
    </g>

    <!-- Seamless Edge Divider (Sits at x=0 and x=2048) -->
    <g id="seam-marker">
      <!-- Vertical Navy Anchor Bar -->
      <path d="M 0,-54 L 11,-42 L 11,42 L 0,54 L -11,42 L -11,-42 Z" fill="#0a1931" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
      <!-- Red Ball Center Accent -->
      <circle cx="0" cy="0" r="14" fill="#d31b28" stroke="#ffffff" stroke-width="2"/>
      <path d="M 0,-14 A 14,14 0 0,1 0,14" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="2,2"/>
      <!-- Stars Above and Below -->
      <use href="#star-sm" x="0" y="-28"/>
      <use href="#star-sm" x="0" y="28"/>
    </g>
  </defs>

  <!-- Base Stadium Stand Background -->
  <rect width="2048" height="128" fill="#ffd21f"/>

  <!-- Top Edge Lighter Stripe and Dark Trim -->
  <rect x="0" y="0" width="2048" height="6" fill="#ffe259"/>
  <rect x="0" y="6" width="2048" height="3" fill="#0a1931"/>

  <!-- Bottom Dark Trim and Lighter Stripe -->
  <rect x="0" y="119" width="2048" height="3" fill="#0a1931"/>
  <rect x="0" y="122" width="2048" height="6" fill="#ffe259"/>

  <!-- SEAM CONNECTORS (Seamless Loop at 0 and 2048) -->
  <use href="#seam-marker" x="0" y="64"/>
  <use href="#seam-marker" x="2048" y="64"/>

  <!-- OUTER FLANKING ELEMENTS (Left & Right) -->
  <!-- Outer Star Clusters -->
  <use href="#star-sm" x="85" y="64"/>
  <use href="#star-md" x="110" y="64"/>
  <use href="#star-sm" x="135" y="64"/>

  <use href="#star-sm" x="1913" y="64"/>
  <use href="#star-md" x="1938" y="64"/>
  <use href="#star-sm" x="1963" y="64"/>

  <!-- Secondary Motifs: Ball & Broadcast Chevrons -->
  <use href="#chevrons-ball" x="260" y="64"/>
  <use href="#chevrons-ball" x="1788" y="64"/>

  <!-- Mid-Zone Accent Stars -->
  <use href="#star-md" x="385" y="64"/>
  <use href="#star-md" x="1663" y="64"/>

  <!-- PRIMARY CRICKET MOTIFS (Crossed Bats, Stumps, Ball, Shield) -->
  <use href="#cricket-crest" x="512" y="64"/>
  <use href="#cricket-crest" x="1536" y="64"/>

  <!-- INNER FLANKING STAR CLUSTERS (Graduated towards Title) -->
  <g>
    <use href="#star-sm" x="615" y="64"/>
    <use href="#star-md" x="645" y="64"/>
    <use href="#star-lg" x="680" y="64"/>

    <use href="#star-lg" x="1368" y="64"/>
    <use href="#star-md" x="1403" y="64"/>
    <use href="#star-sm" x="1433" y="64"/>
  </g>

  <!-- Title Bracket Chevrons -->
  <polygon points="722,64 710,54 714,64 710,74" fill="#0a1931"/>
  <polygon points="1326,64 1338,54 1334,64 1338,74" fill="#0a1931"/>

  <!-- CENTERED TEXT: "BARN STAND" (Sports Broadcast Bold 3D Block Style) -->
  <!-- Layer 1: Solid Deep Shadow -->
  <text x="1024" y="70" text-anchor="middle" dominant-baseline="central" font-family="'Arial Black', Arial, sans-serif" font-size="74" font-weight="900" letter-spacing="5" fill="#040b17">BARN STAND</text>

  <!-- Layer 2: Heavy Deep Navy Outline -->
  <text x="1024" y="65" text-anchor="middle" dominant-baseline="central" font-family="'Arial Black', Arial, sans-serif" font-size="74" font-weight="900" letter-spacing="5" fill="#0a1931" stroke="#0a1931" stroke-width="14" stroke-linejoin="round" stroke-miterlimit="2">BARN STAND</text>

  <!-- Layer 3: Crisp Pure White Text Face -->
  <text x="1024" y="65" text-anchor="middle" dominant-baseline="central" font-family="'Arial Black', Arial, sans-serif" font-size="74" font-weight="900" letter-spacing="5" fill="#ffffff">BARN STAND</text>
</svg>