<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 512" width="256" height="512">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4d91ff" />
      <stop offset="50%" stop-color="#2f7cff" />
      <stop offset="100%" stop-color="#1659d4" />
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259" />
      <stop offset="60%" stop-color="#ffd21f" />
      <stop offset="100%" stop-color="#e0a800" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#26264f" />
      <stop offset="100%" stop-color="#14142b" />
    </linearGradient>
  </defs>

  <!-- Sticker Base Structure -->
  <g id="sticker-base">
    <!-- Outer Heavy Navy Rim -->
    <path d="M 128 14 
             C 142 14, 184 28, 206 46
             L 220 74 
             C 226 120, 222 178, 214 246
             C 208 296, 214 366, 212 396
             L 174 456
             L 128 498
             L 82 456
             L 44 396
             C 42 366, 48 296, 42 246
             C 34 178, 30 120, 36 74
             L 50 46
             C 72 28, 114 14, 128 14 Z"
          fill="#1b1b3a" stroke="#1b1b3a" stroke-width="6" stroke-linejoin="round" />

    <!-- Top Wing Panels (Blue) -->
    <path d="M 128 22 C 146 22, 178 35, 198 50 L 210 76 L 176 96 L 128 58 Z" fill="url(#blueGrad)" stroke="#1b1b3a" stroke-width="3" stroke-linejoin="round" />
    <path d="M 128 22 C 110 22, 78 35, 58 50 L 46 76 L 80 96 L 128 58 Z" fill="url(#blueGrad)" stroke="#1b1b3a" stroke-width="3" stroke-linejoin="round" />

    <!-- Top Lateral Chevrons (Yellow) -->
    <polygon points="198,50 216,76 214,124 186,104 200,74" fill="url(#yellowGrad)" stroke="#1b1b3a" stroke-width="2.5" stroke-linejoin="round" />
    <polygon points="58,50 40,76 42,124 70,104 56,74" fill="url(#yellowGrad)" stroke="#1b1b3a" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Horn Logo Crest Plate (Navy) -->
    <path d="M 128 44 C 158 44, 186 64, 192 100 L 178 136 L 128 152 L 78 136 L 64 100 C 70 64, 98 44, 128 44 Z" fill="url(#navyGrad)" stroke="#ffd21f" stroke-width="2" />
  </g>

  <!-- Cow Horn Crest Emblem -->
  <g id="cow-horn-logo">
    <!-- Back Glow / Trim -->
    <path d="M 128 106
             C 120 90, 80 72, 60 42
             C 54 33, 56 22, 62 18
             C 66 28, 78 48, 104 64
             C 118 72, 125 79, 128 85
             C 131 79, 138 72, 152 64
             C 178 48, 190 28, 194 18
             C 200 22, 202 33, 196 42
             C 176 72, 136 90, 128 106 Z"
          fill="#1b1b3a" />

    <!-- Sweeping Horns (Yellow Gradient) -->
    <path d="M 128 102
             C 120 86, 82 70, 64 42
             C 59 34, 60 25, 64 22
             C 68 30, 80 50, 104 64
             C 116 71, 124 76, 128 82
             C 132 76, 140 71, 152 64
             C 176 50, 188 30, 192 22
             C 196 25, 197 34, 192 42
             C 174 70, 136 86, 128 102 Z"
          fill="url(#yellowGrad)" stroke="#1b1b3a" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Horn Ridges (Navy & Blue Detail) -->
    <path d="M 76 40 C 82 48, 92 56, 102 62" stroke="#1b1b3a" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 180 40 C 174 48, 164 56, 154 62" stroke="#1b1b3a" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 88 52 C 94 58, 102 65, 110 70" stroke="#ffd21f" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <path d="M 168 52 C 162 58, 154 65, 146 70" stroke="#ffd21f" stroke-width="1.5" fill="none" stroke-linecap="round" />

    <!-- Stylised Bull Mask / Shield -->
    <polygon points="128,78 146,88 140,118 128,136 116,118 110,88" fill="url(#blueGrad)" stroke="#1b1b3a" stroke-width="2.5" stroke-linejoin="round" />
    <polygon points="128,84 140,92 135,114 128,126 121,114 116,92" fill="#ffd21f" />
    <polygon points="128,90 134,95 131,110 128,118 125,110 122,95" fill="#1b1b3a" />

    <!-- Cricket Seam Feature in Forehead -->
    <path d="M 128 92 L 128 116" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="2,2" />

    <!-- Star / Quality Accents -->
    <polygon points="128,60 130,65 135,66 131,69 132,74 128,71 124,74 125,69 121,66 126,65" fill="#ffffff" />
    <circle cx="94" cy="98" r="2.5" fill="#ffd21f" />
    <circle cx="162" cy="98" r="2.5" fill="#ffd21f" />
  </g>

  <!-- Midsection: Flank Sports Flashes -->
  <g id="side-flashes">
    <!-- Left Dynamic Chevron Panels -->
    <polygon points="42,134 68,116 74,166 40,192" fill="url(#blueGrad)" stroke="#1b1b3a" stroke-width="2.5" />
    <polygon points="40,198 72,172 74,228 38,252" fill="url(#yellowGrad)" stroke="#1b1b3a" stroke-width="2.5" />
    <polygon points="38,258 72,234 68,290 38,304" fill="url(#blueGrad)" stroke="#1b1b3a" stroke-width="2.5" />
    <polygon points="38,310 66,296 60,348 40,358" fill="url(#yellowGrad)" stroke="#1b1b3a" stroke-width="2.5" />

    <!-- Right Dynamic Chevron Panels -->
    <polygon points="214,134 188,116 182,166 216,192" fill="url(#blueGrad)" stroke="#1b1b3a" stroke-width="2.5" />
    <polygon points="216,198 184,172 182,228 218,252" fill="url(#yellowGrad)" stroke="#1b1b3a" stroke-width="2.5" />
    <polygon points="218,258 184,234 188,290 218,304" fill="url(#blueGrad)" stroke="#1b1b3a" stroke-width="2.5" />
    <polygon points="218,310 190,296 196,348 216,358" fill="url(#yellowGrad)" stroke="#1b1b3a" stroke-width="2.5" />

    <!-- Fine Pinstripe Accents -->
    <path d="M 44 86 L 76 110" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <path d="M 212 86 L 180 110" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Brand Typography Area -->
  <g id="brand-lettering">
    <!-- Main Center Panel Backing -->
    <path d="M 76 142 L 180 142 L 188 284 L 128 300 L 68 284 Z" fill="url(#navyGrad)" stroke="#ffd21f" stroke-width="3" stroke-linejoin="round" />

    <!-- MOO Sub-plate (Yellow) -->
    <polygon points="76,150 180,150 183,212 73,212" fill="url(#yellowGrad)" stroke="#1b1b3a" stroke-width="2" />

    <!-- Inner Blue Ridge for "MOO" -->
    <rect x="78" y="154" width="100" height="54" fill="#2f7cff" rx="4" />
    <rect x="80" y="156" width="96" height="50" fill="url(#navyGrad)" rx="3" />

    <!-- "MOO" Text - Bold Capitals Stacked 1st -->
    <text x="128" y="199"
          font-family="Arial Black, Arial, sans-serif"
          font-size="40"
          font-weight="900"
          letter-spacing="4"
          text-anchor="middle"
          fill="#ffd21f"
          stroke="#1b1b3a"
          stroke-width="1.5">MOO</text>

    <!-- Dividing Athletic Ribbons -->
    <polygon points="70,216 128,222 186,216 184,225 128,231 72,225" fill="#ffd21f" stroke="#1b1b3a" stroke-width="1.5" />

    <!-- "WILLOW" Sub-plate (Blue) -->
    <polygon points="72,228 128,234 184,228 187,276 128,290 69,276" fill="url(#blueGrad)" stroke="#ffd21f" stroke-width="2" />

    <!-- "WILLOW" Text - Bold Capitals Stacked 2nd -->
    <text x="128" y="266"
          font-family="Arial Black, Arial, sans-serif"
          font-size="20.5"
          font-weight="900"
          letter-spacing="5"
          text-anchor="middle"
          fill="#ffffff"
          stroke="#1b1b3a"
          stroke-width="1.5">WILLOW</text>
  </g>

  <!-- Lower Blade Graphic: Chevrons, Tech Badge & Taper -->
  <g id="lower-blade">
    <!-- Large Downward Blue Chevron -->
    <polygon points="66,300 128,322 190,300 196,356 128,382 60,356" fill="url(#blueGrad)" stroke="#1b1b3a" stroke-width="3" stroke-linejoin="round" />

    <!-- Inner Contrast Yellow Chevron -->
    <polygon points="76,324 128,342 180,324 186,362 128,384 70,362" fill="url(#yellowGrad)" stroke="#1b1b3a" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Navy Core Inset -->
    <polygon points="86,346 128,360 170,346 174,374 128,396 82,374" fill="url(#navyGrad)" stroke="#1b1b3a" stroke-width="2" stroke-linejoin="round" />

    <!-- Micro Horn Emblem in Lower Chevron -->
    <path d="M 128 382 C 124 374, 114 366, 108 358 C 109 354, 113 356, 118 360 C 124 364, 128 367, 128 370 C 128 367, 132 364, 138 360 C 143 356, 147 354, 148 358 C 142 366, 132 374, 128 382 Z" fill="#ffd21f" />

    <!-- Performance Label Badge -->
    <g transform="translate(128, 412)">
      <rect x="-48" y="-10" width="96" height="20" rx="4" fill="#ffd21f" stroke="#1b1b3a" stroke-width="2" />
      <text x="0" y="4.5"
            font-family="Arial Black, Arial, sans-serif"
            font-size="9"
            font-weight="900"
            letter-spacing="2.5"
            text-anchor="middle"
            fill="#1b1b3a">PRO BLADE</text>
    </g>

    <!-- Lower Triangular Taper Shields -->
    <polygon points="62,374 128,404 128,446 80,422" fill="url(#blueGrad)" stroke="#1b1b3a" stroke-width="2.5" />
    <polygon points="194,374 128,404 128,446 176,422" fill="url(#yellowGrad)" stroke="#1b1b3a" stroke-width="2.5" />

    <!-- Bottom Spear Tip Chevrons -->
    <polygon points="84,430 128,452 172,430 162,464 128,490 94,464" fill="url(#navyGrad)" stroke="#ffd21f" stroke-width="2.5" stroke-linejoin="round" />

    <polygon points="100,448 128,464 156,448 150,470 128,486 106,470" fill="url(#blueGrad)" stroke="#1b1b3a" stroke-width="2" stroke-linejoin="round" />

    <polygon points="114,462 128,472 142,462 138,476 128,484 118,476" fill="url(#yellowGrad)" stroke="#1b1b3a" stroke-width="1.5" stroke-linejoin="round" />

    <!-- Dynamic Speed Pinstripes & Edge Highlights -->
    <line x1="88" y1="418" x2="128" y2="438" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <line x1="168" y1="418" x2="136" y2="434" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="128" cy="425" r="2.5" fill="#ffffff" />
  </g>
</svg>