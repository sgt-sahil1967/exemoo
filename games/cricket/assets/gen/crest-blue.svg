<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Bats Clip to Shield -->
    <clipPath id="shieldInnerClip">
      <path d="M 128 32 C 172 32 208 40 212 50 C 215 106 202 172 128 226 C 54 172 41 106 44 50 C 48 40 84 32 128 32 Z"/>
    </clipPath>
  </defs>

  <!-- SHIELD BASE & BORDER -->
  <!-- Outer Dark/Navy Rim -->
  <path d="M 128 18 C 178 18 221 26 226 38 C 230 114 214 186 128 244 C 42 186 26 114 30 38 C 35 26 78 18 128 18 Z" fill="#0c1e47"/>

  <!-- Yellow Trim (#ffd21f) -->
  <path d="M 128 24 C 175 24 214 32 218 43 C 222 110 208 178 128 234 C 48 178 34 110 38 43 C 42 32 81 24 128 24 Z" fill="#ffd21f"/>

  <!-- Inner Dark Stroke -->
  <path d="M 128 30 C 173 30 209 38 213 48 C 216 107 203 173 128 228 C 53 173 40 107 43 48 C 47 38 83 30 128 30 Z" fill="#0c1e47"/>

  <!-- Royal Blue (#2f7cff) Shield Interior -->
  <path d="M 128 32 C 172 32 208 40 212 50 C 215 106 202 172 128 226 C 54 172 41 106 44 50 C 48 40 84 32 128 32 Z" fill="#2f7cff"/>

  <!-- Subtle Shield Interior Depth Tone -->
  <path d="M 128 32 C 172 32 208 40 212 50 C 215 106 202 172 128 226 L 128 32 Z" fill="#2568db" opacity="0.4"/>

  <!-- CROSSED BATS (Clipped to shield) -->
  <g clip-path="url(#shieldInnerClip)">
    <!-- Bat 1 (top-left to bottom-right) -->
    <g transform="rotate(-40 128 132)">
      <!-- Handle -->
      <rect x="125" y="38" width="6" height="42" rx="2" fill="#ffffff" stroke="#0c1e47" stroke-width="1.5"/>
      <line x1="125" y1="48" x2="131" y2="48" stroke="#2f7cff" stroke-width="1.5"/>
      <line x1="125" y1="56" x2="131" y2="56" stroke="#2f7cff" stroke-width="1.5"/>
      <line x1="125" y1="64" x2="131" y2="64" stroke="#2f7cff" stroke-width="1.5"/>
      <line x1="125" y1="72" x2="131" y2="72" stroke="#2f7cff" stroke-width="1.5"/>
      <!-- Blade -->
      <path d="M 123 80 L 133 80 L 135 186 C 135 190 121 190 121 186 Z" fill="#f5d59f" stroke="#0c1e47" stroke-width="2"/>
      <path d="M 128 80 L 133 80 L 135 186 L 128 186 Z" fill="#e2b97c"/>
    </g>

    <!-- Bat 2 (top-right to bottom-left) -->
    <g transform="rotate(40 128 132)">
      <!-- Handle -->
      <rect x="125" y="38" width="6" height="42" rx="2" fill="#ffffff" stroke="#0c1e47" stroke-width="1.5"/>
      <line x1="125" y1="48" x2="131" y2="48" stroke="#2f7cff" stroke-width="1.5"/>
      <line x1="125" y1="56" x2="131" y2="56" stroke="#2f7cff" stroke-width="1.5"/>
      <line x1="125" y1="64" x2="131" y2="64" stroke="#2f7cff" stroke-width="1.5"/>
      <line x1="125" y1="72" x2="131" y2="72" stroke="#2f7cff" stroke-width="1.5"/>
      <!-- Blade -->
      <path d="M 123 80 L 133 80 L 135 186 C 135 190 121 190 121 186 Z" fill="#f5d59f" stroke="#0c1e47" stroke-width="2"/>
      <path d="M 128 80 L 133 80 L 135 186 L 128 186 Z" fill="#e2b97c"/>
    </g>
  </g>

  <!-- TOP TEAM SUBTITLE -->
  <text x="128" y="52" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="11" fill="#ffd21f" letter-spacing="3">MOO MOO XI</text>

  <!-- CRICKET BALL -->
  <g id="cricket-ball">
    <!-- Ball Drop Shadow -->
    <circle cx="128" cy="142" r="21" fill="#0c1e47" opacity="0.4"/>
    <!-- Outer Rim -->
    <circle cx="128" cy="140" r="20" fill="#0c1e47"/>
    <!-- Red Ball Core -->
    <circle cx="128" cy="140" r="18.5" fill="#d62828"/>
    <!-- Shadow Side -->
    <path d="M 128 121.5 A 18.5 18.5 0 0 1 146.5 140 A 18.5 18.5 0 0 1 128 158.5 Z" fill="#a81b1b"/>
    <!-- Ball Specular -->
    <circle cx="121" cy="133" r="3.5" fill="#ff7676" opacity="0.7"/>
    <!-- Seam Center Stroke -->
    <path d="M 120 123.5 C 124 133 132 147 136 156.5" fill="none" stroke="#ffffff" stroke-width="2"/>
    <!-- Seam Stitches -->
    <path d="M 118 126 L 123 124 M 121 132 L 126 130 M 125 138 L 130 136 M 129 144 L 134 142 M 133 151 L 138 149" fill="none" stroke="#ffffff" stroke-width="1.2"/>
  </g>

  <!-- COW HEAD -->
  <g id="cow-head">
    <!-- Horns -->
    <!-- Left Horn -->
    <path d="M 110 74 C 104 60 92 56 84 58 C 88 68 100 76 106 80 Z" fill="#ffd21f" stroke="#0c1e47" stroke-width="2" stroke-linejoin="round"/>
    <!-- Right Horn -->
    <path d="M 146 74 C 152 60 164 56 172 58 C 168 68 156 76 150 80 Z" fill="#ffd21f" stroke="#0c1e47" stroke-width="2" stroke-linejoin="round"/>

    <!-- Ears -->
    <!-- Left Ear -->
    <path d="M 104 80 C 86 80 72 88 74 94 C 80 97 94 94 104 87 Z" fill="#ffffff" stroke="#0c1e47" stroke-width="2"/>
    <path d="M 100 82 C 88 83 78 89 80 93 C 84 94 94 92 100 87 Z" fill="#ff9ebb"/>
    <!-- Right Ear -->
    <path d="M 152 80 C 170 80 184 88 182 94 C 176 97 162 94 152 87 Z" fill="#ffffff" stroke="#0c1e47" stroke-width="2"/>
    <path d="M 156 82 C 168 83 178 89 176 93 C 172 94 162 92 156 87 Z" fill="#ff9ebb"/>

    <!-- Head Contour (Base) -->
    <polygon points="104,70 152,70 156,98 148,114 108,114 100,98" fill="#ffffff" stroke="#0c1e47" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Head Patches (Black/Navy) -->
    <!-- Right Eye & Forehead Patch -->
    <path d="M 124 70 L 152 70 L 155 94 L 140 102 L 128 88 Z" fill="#0c1e47"/>
    <!-- Small Left Patch -->
    <path d="M 104 70 L 112 70 L 106 82 L 101 79 Z" fill="#0c1e47"/>

    <!-- Cow Crown Tuft -->
    <path d="M 120 67 L 128 62 L 136 67 L 132 71 L 124 71 Z" fill="#ffd21f" stroke="#0c1e47" stroke-width="1.5"/>

    <!-- Eyes (Intense Mascot Style) -->
    <!-- Left Eye -->
    <polygon points="108,86 118,89 114,94 107,91" fill="#0c1e47"/>
    <circle cx="113" cy="90" r="1.5" fill="#ffffff"/>
    <!-- Right Eye (Inside Dark Patch) -->
    <polygon points="148,86 138,89 142,94 149,91" fill="#ffffff"/>
    <polygon points="146,88 140,90 143,93 147,91" fill="#0c1e47"/>
    <circle cx="144" cy="90.5" r="1" fill="#ffffff"/>

    <!-- Muzzle / Snout -->
    <rect x="110" y="100" width="36" height="22" rx="7" fill="#ffb3c7" stroke="#0c1e47" stroke-width="2"/>
    <!-- Nostrils -->
    <ellipse cx="120" cy="111" rx="2.5" ry="3.5" fill="#0c1e47"/>
    <ellipse cx="136" cy="111" rx="2.5" ry="3.5" fill="#0c1e47"/>
    <!-- Smile Accent -->
    <path d="M 125 117 Q 128 119 131 117" stroke="#0c1e47" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- RIBBON BANNER -->
  <g id="ribbon">
    <!-- Ribbon Fold Shadow / Back Layer -->
    <path d="M 46 198 L 32 178 L 32 208 L 52 216 Z" fill="#a07800" stroke="#0c1e47" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 210 198 L 224 178 L 224 208 L 204 216 Z" fill="#a07800" stroke="#0c1e47" stroke-width="2" stroke-linejoin="round"/>

    <!-- Ribbon Tails (Left and Right) -->
    <!-- Left Tail -->
    <path d="M 48 184 L 20 172 L 30 193 L 20 214 L 48 202 Z" fill="#ffd21f" stroke="#0c1e47" stroke-width="2" stroke-linejoin="round"/>
    <!-- Right Tail -->
    <path d="M 208 184 L 236 172 L 226 193 L 236 214 L 208 202 Z" fill="#ffd21f" stroke="#0c1e47" stroke-width="2" stroke-linejoin="round"/>

    <!-- Main Front Ribbon Body -->
    <path d="M 44 182 Q 128 168 212 182 L 206 216 Q 128 202 50 216 Z" fill="#ffd21f" stroke="#0c1e47" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Inner Ribbon Edge Accent Lines -->
    <path d="M 48 186 Q 128 172 208 186" fill="none" stroke="#ffe77a" stroke-width="1.5"/>
    <path d="M 53 211 Q 128 198 203 211" fill="none" stroke="#d49e00" stroke-width="1.5"/>

    <!-- RIBBON TEXT "MOO" -->
    <text x="128" y="202" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="23" fill="#0c1e47" letter-spacing="4">MOO</text>
  </g>

  <!-- BOTTOM ACCENT STAR -->
  <polygon points="128,217 130.5,223 137,223 132,227 134,233 128,229 122,233 124,227 119,223 125.5,223" fill="#ffd21f" stroke="#0c1e47" stroke-width="1"/>
</svg>