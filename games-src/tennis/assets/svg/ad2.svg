<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 128" width="1024" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020612"/>
      <stop offset="20%" stop-color="#07132B"/>
      <stop offset="50%" stop-color="#0D2145"/>
      <stop offset="80%" stop-color="#07132B"/>
      <stop offset="100%" stop-color="#020612"/>
    </linearGradient>

    <!-- Deep Navy Radial Glow -->
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A3A6D" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#07132B" stop-opacity="0"/>
    </radialGradient>

    <!-- Luxury Gold Metallic Gradients -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CA9E50"/>
      <stop offset="25%" stop-color="#FDF0A6"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="75%" stop-color="#8A6421"/>
      <stop offset="90%" stop-color="#B88E2C"/>
      <stop offset="100%" stop-color="#F3E5AB"/>
    </linearGradient>

    <linearGradient id="gold-bright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6"/>
      <stop offset="30%" stop-color="#FFE082"/>
      <stop offset="70%" stop-color="#CBA135"/>
      <stop offset="100%" stop-color="#8C6617"/>
    </linearGradient>

    <linearGradient id="gold-light-soft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0"/>
      <stop offset="30%" stop-color="#FDF0A6" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="70%" stop-color="#FDF0A6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="gold-dark-bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#594010"/>
      <stop offset="50%" stop-color="#AA7C11"/>
      <stop offset="100%" stop-color="#3D2B0A"/>
    </linearGradient>

    <!-- Carbon Fiber / Tech Sports Texture Pattern -->
    <pattern id="tech-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#000000" fill-opacity="0"/>
      <path d="M0 16 L16 0 M0 0 L16 16" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
      <path d="M0 8 L8 0 L16 8 L8 16 Z" fill="#ffffff" fill-opacity="0.015"/>
    </pattern>

    <!-- Angled Dynamic Shading -->
    <linearGradient id="angle-overlay" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Glow Filter for LED Readability -->
    <filter id="gold-glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComponentTransfer in="blur" result="glow1">
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- 1. BASE BACKGROUND -->
  <rect width="1024" height="128" fill="url(#bg-grad)"/>
  
  <!-- Subtle Center Radial Highlight -->
  <rect x="150" y="0" width="724" height="128" fill="url(#center-glow)"/>

  <!-- Tech Grid Overlay for Modern Sports Feel -->
  <rect width="1024" height="128" fill="url(#tech-grid)"/>

  <!-- Dynamic Angled Sport Stripes (Left & Right Background Geometry) -->
  <g opacity="0.25">
    <polygon points="-20,0 60,0 20,128 -60,128" fill="url(#gold-grad)"/>
    <polygon points="50,0 80,0 40,128 10,128" fill="#FFFFFF"/>
    <polygon points="964,0 1004,0 1044,128 1004,128" fill="url(#gold-grad)"/>
    <polygon points="1010,0 1040,0 1080,128 1050,128" fill="#FFFFFF"/>
  </g>

  <!-- Dark Vibe Vignette -->
  <rect width="1024" height="128" fill="url(#angle-overlay)"/>

  <!-- 2. STADIUM BOARD LED BORDERS (Top & Bottom Precision Gold Lines) -->
  <rect x="0" y="0" width="1024" height="3" fill="url(#gold-grad)"/>
  <rect x="0" y="125" width="1024" height="3" fill="url(#gold-grad)"/>
  
  <!-- Glowing Light accents on border -->
  <rect x="250" y="0" width="524" height="2" fill="url(#gold-light-soft)"/>
  <rect x="250" y="126" width="524" height="2" fill="url(#gold-light-soft)"/>

  <!-- ==================== LEFT SECTION: ICON EMBLEM ==================== -->
  <g transform="translate(82, 64)" filter="url(#shadow)">
    <!-- Outer Octagonal Watch Bezel -->
    <polygon points="0,-46 32,-32 46,0 32,32 0,46 -32,32 -46,0 -32,-32" fill="url(#gold-dark-bevel)" stroke="url(#gold-grad)" stroke-width="3"/>
    <!-- Inner Bezel Ring -->
    <circle cx="0" cy="0" r="34" fill="#050E1E" stroke="url(#gold-grad)" stroke-width="1.5"/>
    
    <!-- Bezel Screws (Luxury Watch Detail) -->
    <circle cx="-22" cy="-22" r="1.5" fill="#FFE58F"/>
    <circle cx="22" cy="-22" r="1.5" fill="#FFE58F"/>
    <circle cx="22" cy="22" r="1.5" fill="#FFE58F"/>
    <circle cx="-22" cy="22" r="1.5" fill="#FFE58F"/>

    <!-- Dial Ticks -->
    <path d="M0,-31 L0,-27 M31,0 L27,0 M0,31 L0,27 M-31,0 L-27,0" stroke="url(#gold-grad)" stroke-width="2"/>

    <!-- Sharp Geometric "N" + Compass Logo Mark -->
    <!-- N Facet Left -->
    <polygon points="-14,18 -14,-18 -5,-18 -5,8" fill="url(#gold-bright)"/>
    <!-- N Facet Diagonal -->
    <polygon points="-5,-18 14,14 14,18 5,18 -14,-12 -14,-18" fill="url(#gold-grad)"/>
    <!-- N Facet Right -->
    <polygon points="5,-18 14,-18 14,18 5,18" fill="url(#gold-bright)"/>
    
    <!-- Central Diamond / Star Facet Overlay -->
    <polygon points="0,-22 4,-6 20,0 4,6 0,22 -4,6 -20,0 -4,-6" fill="url(#gold-grad)" opacity="0.85"/>
    <polygon points="0,-22 4,-6 0,0 -4,-6" fill="#FFF8D6"/>
    <polygon points="0,22 4,6 0,0 -4,6" fill="#8C6617"/>
  </g>

  <!-- Vertical Divider -->
  <line x1="152" y1="28" x2="152" y2="100" stroke="url(#gold-grad)" stroke-width="1" opacity="0.4"/>

  <!-- ==================== CENTER SECTION: MAIN WORDMARK ==================== -->
  <g filter="url(#shadow)">
    <!-- Sub-headline / Brand Heritage Above -->
    <text x="512" y="30" font-family="Arial Black, Impact, sans-serif" font-size="11" font-weight="900" fill="#D4AF37" letter-spacing="9" text-anchor="middle" opacity="0.9">
      HAUTE HORLOGERIE
    </text>

    <!-- MAIN BRAND NAME: NORDHAVN (Huge, High Contrast LED Legibility) -->
    <!-- Main Fill Text -->
    <text x="516" y="84" font-family="Arial Black, Impact, sans-serif" font-size="58" font-weight="900" fill="url(#gold-bright)" letter-spacing="12" text-anchor="middle" filter="url(#gold-glow-filter)">
      NORDHAVN
    </text>
    
    <!-- Metallic Bevel Overlay Effect (3D Stroke) -->
    <text x="516" y="84" font-family="Arial Black, Impact, sans-serif" font-size="58" font-weight="900" fill="none" stroke="url(#gold-dark-bevel)" stroke-width="1.5" letter-spacing="12" text-anchor="middle">
      NORDHAVN
    </text>

    <!-- Sub-headline / Tagline Below -->
    <text x="512" y="106" font-family="Arial Black, Impact, sans-serif" font-size="10.5" font-weight="900" fill="#FFFFFF" letter-spacing="8" text-anchor="middle" opacity="0.85">
      SWISS CHRONOMETERS  <tspan fill="url(#gold-grad)">•</tspan>  EST. 1898
    </text>
  </g>

  <!-- Fine Horizontal Gold Accent Rules framing the center text -->
  <path d="M 230 78 L 260 78 M 764 78 L 794 78" stroke="url(#gold-grad)" stroke-width="2" stroke-linecap="round"/>

  <!-- ==================== RIGHT SECTION: OFFICIAL TIMEKEEPER BADGE ==================== -->
  <!-- Vertical Divider -->
  <line x1="860" y1="28" x2="860" y2="100" stroke="url(#gold-grad)" stroke-width="1" opacity="0.4"/>

  <g transform="translate(932, 64)" filter="url(#shadow)">
    <!-- Luxury Chrono Sub-dial Graphic -->
    <circle cx="-42" cy="0" r="20" fill="#040C1A" stroke="url(#gold-grad)" stroke-width="1.5"/>
    <circle cx="-42" cy="0" r="17" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-dasharray="2,2" opacity="0.6"/>
    <!-- Chrono Hands -->
    <line x1="-42" y1="0" x2="-42" y2="-13" stroke="url(#gold-bright)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-42" y1="0" x2="-34" y2="4" stroke="url(#gold-bright)" stroke-width="1" stroke-linecap="round"/>
    <circle cx="-42" cy="0" r="2" fill="#FFFFFF"/>

    <!-- Right Stacked Text -->
    <text x="-14" y="-8" font-family="Arial Black, Impact, sans-serif" font-size="10" font-weight="900" fill="#FFFFFF" letter-spacing="2" text-anchor="start">
      OFFICIAL
    </text>
    <text x="-14" y="6" font-family="Arial Black, Impact, sans-serif" font-size="11" font-weight="900" fill="url(#gold-bright)" letter-spacing="2" text-anchor="start">
      TIMEKEEPER
    </text>
    
    <!-- Small Decorative Gold Bar -->
    <rect x="-14" y="12" width="68" height="2" fill="url(#gold-grad)"/>
  </g>

  <!-- Corner Precision Trim Accents -->
  <path d="M 0 0 L 15 0 L 0 15 Z" fill="url(#gold-grad)"/>
  <path d="M 1024 0 L 1009 0 L 1024 15 Z" fill="url(#gold-grad)"/>
  <path d="M 0 128 L 15 128 L 0 113 Z" fill="url(#gold-grad)"/>
  <path d="M 1024 128 L 1009 128 L 1024 113 Z" fill="url(#gold-grad)"/>
</svg>