<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exemoo Alpha Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--red:#ff3b30;--red-d:#b3160f;--yellow:#ffd21f;--ink:#1b1b3a}
*{box-sizing:border-box;margin:0}
body{font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink);background:#7fd0ff;min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.card{width:100%;max-width:420px;background:#fff;border:4px solid var(--ink);border-radius:24px;box-shadow:0 8px 0 var(--ink);padding:28px 24px;text-align:center}
.logo{font-family:'Lilita One',sans-serif;font-size:44px;color:var(--yellow);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink)}
.tag{display:inline-block;margin:6px 0 14px;background:var(--ink);color:#fff;border-radius:10px;padding:0 10px;font-size:14px;letter-spacing:.08em}
p{font-size:17px;line-height:1.35;margin:0 0 16px}
input{width:100%;font:inherit;font-size:18px;padding:10px 14px;border:3px solid var(--ink);border-radius:14px;margin-bottom:14px}
button{font-family:'Lilita One',sans-serif;font-size:20px;color:#fff;background:var(--red);border:4px solid var(--ink);border-radius:16px;padding:8px 22px;cursor:pointer;box-shadow:0 6px 0 var(--red-d),0 6px 0 4px var(--ink);width:100%}
button:disabled{opacity:.6;cursor:default}
.msg{min-height:1.4em;margin:16px 0 0;font-weight:800}
.err{color:var(--red-d)}
small{display:block;margin-top:14px;opacity:.75;font-size:14px}
</style>
</head>
<body>
<main class="card">
  <div class="logo">EXEMOO</div>
  <div class="tag">ALPHA</div>
  <p>Exemoo is invite-only for now. Enter the email you were invited with and we'll send you a sign-in link.</p>
  <form id="f">
    <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required aria-label="Email">
    <button id="go" type="submit">Send sign-in link</button>
  </form>
  <p id="msg" class="msg" role="status"></p>
  <small>Open the link on the computer or TV you play on. Your phone doesn't need to sign in: it pairs with the QR code.</small>
</main>
<script>
const $ = (id) => document.getElementById(id);
if (new URLSearchParams(location.search).has('expired')) {
  $('msg').textContent = 'That link has expired or is not valid. Ask for a new one.';
  $('msg').className = 'msg err';
}
$('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('go').disabled = true;
  $('msg').className = 'msg';
  $('msg').textContent = 'Sending...';
  try {
    const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: $('email').value }) });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || 'Something went wrong. Try again.');
    if (body.open) return location.replace('/');
    $('msg').textContent = "If that email is on the alpha list, a sign-in link is on its way. Check your inbox (and spam).";
  } catch (err) {
    $('msg').textContent = err.message;
    $('msg').className = 'msg err';
  } finally {
    $('go').disabled = false;
  }
});
</script>
</body>
</html>
