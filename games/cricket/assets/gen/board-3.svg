<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 128" width="1024" height="128">
  <defs>
    <clipPath id="boardClip">
      <rect x="0" y="0" width="1024" height="128" rx="0" />
    </clipPath>
  </defs>

  <g clip-path="url(#boardClip)">
    <!-- Base Background -->
    <rect x="0" y="0" width="1024" height="128" fill="#071739" />

    <!-- Dynamic Sports Geometry & Angle Stripes -->
    <polygon points="0,0 120,0 80,128 0,128" fill="#0B2252" />
    <polygon points="120,0 134,0 94,128 80,128" fill="#00D084" />
    <polygon points="144,0 152,0 112,128 104,128" fill="#FFC72C" />

    <!-- Right Dynamic Chevrons -->
    <polygon points="860,0 882,0 842,128 820,128" fill="#0B2252" />
    <polygon points="882,0 892,0 852,128 842,128" fill="#00D084" />
    <polygon points="898,0 1024,0 1024,128 858,128" fill="#0C265C" />
    <polygon points="985,0 1024,0 1024,128 945,128" fill="#081A3E" />

    <!-- LOGO MARK: Modern Tiered Geometric "Haystack/H-Vault" (Left side) -->
    <g transform="translate(16, 0)">
      <!-- Base Tier -->
      <polygon points="34,88 88,88 82,74 40,74" fill="#E5A910" />
      <!-- Middle Tier (Split forming stylized 'H') -->
      <polygon points="42,70 58,70 55,54 39,54" fill="#FFC72C" />
      <polygon points="64,70 80,70 83,54 67,54" fill="#FFD45E" />
      <rect x="54" y="58" width="14" height="8" fill="#FFC72C" />
      <!-- Upper Tier -->
      <polygon points="42,50 59,50 56,36 45,36" fill="#FFC72C" />
      <polygon points="63,50 80,50 77,36 66,36" fill="#FFE28A" />
      <!-- Apex Point -->
      <polygon points="56,32 66,32 63,22 59,22" fill="#00E599" />
      <!-- Modern Hex-Ring Accent Frame -->
      <polygon points="26,58 35,26 61,16 87,26 96,58 87,90 61,100 35,90" fill="none" stroke="#FFC72C" stroke-width="3" stroke-linejoin="round" opacity="0.4" />
      <polygon points="30,58 38,30 61,21 84,30 92,58 84,86 61,95 38,86" fill="none" stroke="#00D084" stroke-width="1.5" stroke-linejoin="round" />
    </g>

    <!-- BRAND TYPOGRAPHY: Center Anchor -->
    <!-- "HAYSTACK" -->
    <text x="175" y="77" fill="#FFFFFF" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="54" letter-spacing="1.5">HAYSTACK</text>

    <!-- "BANK" (Gold with strong punch) -->
    <text x="525" y="77" fill="#FFC72C" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="54" letter-spacing="2">BANK</text>

    <!-- Divider Notch -->
    <polygon points="507,35 515,35 503,79 495,79" fill="#00D084" />

    <!-- TAGLINE & CRICKET GROUND BROADCAST ACCENT -->
    <g transform="translate(178, 86)">
      <!-- Green Accent Capsule -->
      <rect x="0" y="6" width="9" height="14" rx="2" fill="#00D084" />
      <text x="18" y="18" fill="#C5D5EA" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="14.5" letter-spacing="3.8">SOLID AS HARVEST</text>
      <!-- Bullet -->
      <circle cx="230" cy="14" r="2.5" fill="#FFC72C" />
      <text x="242" y="18" fill="#FFC72C" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="14.5" letter-spacing="3.8">INVESTED IN EVERY INNINGS</text>
    </g>

    <!-- RIGHT SECTION: Broadcast Partner Badge & URL -->
    <g transform="translate(740, 20)">
      <!-- Angled Badge Base -->
      <polygon points="152,4 274,4 256,46 134,46" fill="#00D084" />
      <text x="204" y="31" fill="#041830" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="16" letter-spacing="1" text-anchor="middle">OFFICIAL</text>
      <text x="204" y="43" fill="#041830" font-family="Arial, sans-serif" font-weight="900" font-size="9" letter-spacing="1.5" text-anchor="middle">PARTNER</text>

      <!-- Digital Destination URL -->
      <text x="200" y="76" fill="#FFFFFF" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="15" letter-spacing="1" text-anchor="middle">HAYSTACK.COM</text>
      <text x="200" y="91" fill="#FFC72C" font-family="Arial, sans-serif" font-weight="bold" font-size="9.5" letter-spacing="2" text-anchor="middle">WEALTH &amp; AGRIBUSINESS</text>
    </g>

    <!-- Top & Bottom Edge Ground-Rail Stripes (TV Broadcast Rig Detail) -->
    <rect x="0" y="0" width="1024" height="4" fill="#00D084" />
    <rect x="0" y="124" width="1024" height="4" fill="#FFC72C" />
  </g>

  <!-- 6px Dark Outer Boundary Outline -->
  <rect x="3" y="3" width="1018" height="122" rx="1" fill="none" stroke="#020914" stroke-width="6" />
</svg>