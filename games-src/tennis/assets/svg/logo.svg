<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="100%" height="100%">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="3" dy="5" stdDeviation="3" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <!-- Electric Lime Gradient -->
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e1ff5e" />
      <stop offset="50%" stop-color="#c8ff2e" />
      <stop offset="100%" stop-color="#9ee600" />
    </linearGradient>

    <!-- White Text Gradient -->
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d6e0ea" />
    </linearGradient>

    <!-- Tennis Ball Body Gradient -->
    <radialGradient id="ballGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f4ff7a" />
      <stop offset="50%" stop-color="#c8ff2e" />
      <stop offset="100%" stop-color="#7ab800" />
    </radialGradient>

    <!-- Motion Streak Gradient -->
    <linearGradient id="streakGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c8ff2e" stop-opacity="0" />
      <stop offset="70%" stop-color="#c8ff2e" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#c8ff2e" stop-opacity="1" />
    </linearGradient>
  </defs>

  <!-- Main Skewed Group for Dynamic Sport Motion -->
  <g filter="url(#shadow)" transform="skewX(-12) translate(15, 0)">
    
    <!-- MOTION STREAKS / SPEED LINES (LEFT) -->
    <g>
      <!-- Fast trailing swooshes -->
      <path d="M 25 54 L 95 54 L 83 60 L 35 60 Z" fill="url(#streakGrad)" opacity="0.5" />
      <path d="M 10 73 L 108 73 L 95 81 L 22 81 Z" fill="url(#streakGrad)" opacity="0.9" />
      <path d="M 38 93 L 98 93 L 88 98 L 48 98 Z" fill="url(#streakGrad)" opacity="0.6" />
      
      <!-- Dynamic curved impact arc -->
      <path d="M 72 40 C 42 58 42 100 72 118 C 58 100 58 58 72 40 Z" fill="#c8ff2e" opacity="0.8" />
    </g>

    <!-- STYLISED TENNIS BALL -->
    <g transform="translate(112, 77)">
      <!-- Ball Base -->
      <circle cx="0" cy="0" r="27" fill="url(#ballGrad)" />
      
      <!-- Tennis Ball Curved Seams -->
      <path d="M -18 -20 C -7 -10 -7 10 -18 20" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.9" />
      <path d="M 18 -20 C 7 -10 7 10 18 20" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.9" />

      <!-- High-speed Inner Glow / Highlight -->
      <path d="M -15 -18 A 23 23 0 0 1 12 -21 A 22 22 0 0 0 -11 -12 Z" fill="#ffffff" opacity="0.6" />
    </g>

    <!-- WORDMARK TEXT ("COURT ACE") -->
    <g>
      <!-- Main Text -->
      <text x="155" y="100" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="70" letter-spacing="1">
        <tspan fill="url(#whiteGrad)">COURT</tspan>
        <tspan fill="url(#limeGrad)" dx="12">ACE</tspan>
      </text>

      <!-- Top Speed Accent Lines above "ACE" -->
      <path d="M 432 36 L 585 36 L 575 42 L 440 42 Z" fill="#ffffff" opacity="0.85" />
      <path d="M 540 28 L 595 28 L 588 32 L 546 32 Z" fill="#c8ff2e" />

      <!-- Dynamic Underline / Sport Stripe -->
      <path d="M 155 112 L 588 112 L 572 123 L 171 123 Z" fill="url(#limeGrad)" />
      <path d="M 220 128 L 570 128 L 563 132 L 227 132 Z" fill="#ffffff" opacity="0.6" />
    </g>

  </g>
</svg>