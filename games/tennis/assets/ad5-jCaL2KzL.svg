<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 128" width="1024" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B0E" />
      <stop offset="40%" stop-color="#121820" />
      <stop offset="70%" stop-color="#1A232D" />
      <stop offset="100%" stop-color="#0A0D11" />
    </linearGradient>

    <!-- Teal Electric Neon Gradient -->
    <linearGradient id="tealNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00B4D8" />
    </linearGradient>

    <!-- Bright Cyan Accent Gradient -->
    <linearGradient id="tealBright" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="50%" stop-color="#00F7C2" />
      <stop offset="100%" stop-color="#9AFFED" />
    </linearGradient>

    <!-- Premium Metallic Text Gradient -->
    <linearGradient id="silverText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Graphite Dark Panel Gradient -->
    <linearGradient id="graphitePanel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2630" />
      <stop offset="100%" stop-color="#0F141C" />
    </linearGradient>

    <!-- Carbon Grid Pattern -->
    <pattern id="carbonGrid" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="#141B22" />
      <rect x="3" width="3" height="3" fill="#0D1217" />
      <rect y="3" width="3" height="3" fill="#0D1217" />
      <rect x="3" y="3" width="3" height="3" fill="#141B22" />
    </pattern>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Glow Filter -->
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Full-Bleed Background -->
  <rect width="1024" height="128" fill="url(#bgGrad)" />

  <!-- Carbon Texture Overlay -->
  <rect width="1024" height="128" fill="url(#carbonGrid)" opacity="0.4" />

  <!-- Dynamic Geometric Speed Graphics (Graphite & Teal Rays) -->
  <path d="M-20,128 L120,0 L260,0 L120,128 Z" fill="#161E27" opacity="0.6" />
  <path d="M140,128 L230,0 L245,0 L155,128 Z" fill="url(#tealNeon)" opacity="0.15" />
  <path d="M420,0 L580,128 L510,128 L350,0 Z" fill="#1E2834" opacity="0.4" />
  <path d="M750,0 L910,128 L870,128 L710,0 Z" fill="url(#tealNeon)" opacity="0.08" />

  <!-- Outer Framing LED Glow Lines -->
  <rect x="0" y="0" width="1024" height="3" fill="url(#tealNeon)" filter="url(#subtleGlow)" />
  <rect x="0" y="125" width="1024" height="3" fill="url(#tealNeon)" filter="url(#subtleGlow)" />

  <!-- Angled Divider Accents Left/Right -->
  <path d="M0,0 L16,0 L0,48 Z" fill="url(#tealBright)" />
  <path d="M1024,128 L1008,128 L1024,80 Z" fill="url(#tealBright)" />

  <!-- ==================== LOGO MARK (Left Side) ==================== -->
  <g transform="translate(24, 0)">
    <!-- Outer Shield / Hexagon Frame -->
    <polygon points="68,16 104,37 104,91 68,112 32,91 32,37" fill="url(#graphitePanel)" stroke="url(#tealNeon)" stroke-width="2.5" filter="url(#subtleGlow)" />
    
    <!-- Dynamic Hexagon Cutouts / Tech Lines -->
    <polygon points="68,22 98,39 98,89 68,106 38,89 38,39" fill="none" stroke="#2A3644" stroke-width="1.5" />
    
    <!-- Futuristic 'K' Power Blade Symbol -->
    <!-- Left Spine -->
    <path d="M48,32 L58,32 L58,96 L48,96 Z" fill="url(#tealBright)" filter="url(#subtleGlow)" />
    <!-- Upper Blade -->
    <path d="M64,60 L84,34 L96,34 L72,64 Z" fill="#FFFFFF" />
    <path d="M64,60 L84,34 L77,34 L60,56 Z" fill="url(#tealNeon)" />
    <!-- Lower Blade -->
    <path d="M64,68 L96,94 L82,94 L58,74 Z" fill="url(#tealBright)" filter="url(#subtleGlow)" />
  </g>

  <!-- ==================== BRAND WORDMARK "KOVA" (Vector Paths) ==================== -->
  <g transform="translate(150, 32)">
    <!-- Letter K -->
    <g>
      <path d="M0,0 L20,0 L20,64 L0,64 Z" fill="url(#silverText)" />
      <path d="M22,33 L52,0 L76,0 L40,38 Z" fill="url(#silverText)" />
      <path d="M31,31 L78,64 L54,64 L18,39 Z" fill="url(#tealBright)" filter="url(#subtleGlow)" />
    </g>

    <!-- Letter O -->
    <g transform="translate(88, 0)">
      <path d="M22,0 L50,0 L72,22 L72,42 L50,64 L22,64 L0,42 L0,22 Z
               M22,16 L16,24 L16,40 L22,48 L50,48 L56,40 L56,24 L50,16 Z" fill="url(#silverText)" fill-rule="evenodd" />
      <!-- Inner Electric Core Line -->
      <polygon points="24,4 48,4 64,20 64,44 48,60 24,60 8,44 8,20" fill="none" stroke="url(#tealNeon)" stroke-width="1" opacity="0.7" />
    </g>

    <!-- Letter V -->
    <g transform="translate(170, 0)">
      <path d="M0,0 L22,0 L41,48 L60,0 L82,0 L49,64 L33,64 Z" fill="url(#silverText)" />
      <path d="M33,64 L49,64 L60,38 L51,38 Z" fill="url(#tealBright)" filter="url(#subtleGlow)" />
    </g>

    <!-- Letter A -->
    <g transform="translate(262, 0)">
      <path d="M31,0 L51,0 L82,64 L60,64 L53,48 L28,48 L21,64 L0,64 Z
               M40,18 L33,34 L48,34 Z" fill="url(#silverText)" fill-rule="evenodd" />
      <!-- Sharp Teal Crossbar Accent -->
      <polygon points="18,42 63,42 67,35 22,35" fill="url(#tealBright)" filter="url(#subtleGlow)" />
    </g>
  </g>

  <!-- Dynamic Center Separator Line -->
  <path d="M530,20 L515,108 L519,108 L534,20 Z" fill="url(#tealNeon)" filter="url(#subtleGlow)" />
  <path d="M538,20 L535,38 L523,108 L526,108 Z" fill="#FFFFFF" opacity="0.4" />

  <!-- ==================== CENTER-RIGHT MESSAGING ==================== -->
  <!-- Main Tagline -->
  <text x="555" y="58" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="27" fill="#FFFFFF" letter-spacing="2.5" font-style="italic">
    PURE ELECTRIC GT
  </text>

  <!-- Performance Badges / Sub-text -->
  <g transform="translate(555, 72)">
    <!-- Sub-tagline -->
    <text x="0" y="22" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="13.5" fill="url(#tealBright)" letter-spacing="3" filter="url(#subtleGlow)">
      1020 HP  <tspan fill="#475569">|</tspan>  0-60 MPH IN 1.9s  <tspan fill="#475569">|</tspan>  ZERO EMISSIONS
    </text>
  </g>

  <!-- ==================== RIGHT SIDE CALL-TO-ACTION BADGE ==================== -->
  <g transform="translate(860, 32)">
    <!-- Outer Glow Frame -->
    <rect x="0" y="0" width="136" height="64" rx="8" fill="url(#graphitePanel)" stroke="url(#tealNeon)" stroke-width="2" filter="url(#subtleGlow)" />
    
    <!-- Tech Corner Cut Accents -->
    <path d="M0,12 L12,0 L0,0 Z" fill="url(#tealBright)" />
    <path d="M124,64 L136,52 L136,64 Z" fill="url(#tealBright)" />

    <!-- Badge Internal Graphics -->
    <text x="68" y="28" font-family="Arial Black, Impact, sans-serif" font-size="11" font-weight="900" fill="#94A3B8" text-anchor="middle" letter-spacing="1.5">
      THE FUTURE
    </text>
    <text x="68" y="48" font-family="Arial Black, Impact, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
      DRIVE KOVA
    </text>

    <!-- Forward Chevron Arrows -->
    <path d="M116,28 L122,32 L116,36" fill="none" stroke="url(#tealBright)" stroke-width="2.5" stroke-linecap="round" filter="url(#subtleGlow)" />
  </g>

  <!-- Top & Bottom LED Accent Lights Highlights -->
  <circle cx="200" cy="1.5" r="1.5" fill="#FFFFFF" filter="url(#subtleGlow)" />
  <circle cx="500" cy="1.5" r="1.5" fill="#00E5FF" filter="url(#subtleGlow)" />
  <circle cx="800" cy="1.5" r="1.5" fill="#FFFFFF" filter="url(#subtleGlow)" />
  <circle cx="350" cy="126.5" r="1.5" fill="#00E5FF" filter="url(#subtleGlow)" />
  <circle cx="650" cy="126.5" r="1.5" fill="#FFFFFF" filter="url(#subtleGlow)" />

</svg>