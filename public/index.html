<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EXEMOO — Move to Play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#ff3b30; --red-d:#b3160f; --yellow:#ffd21f; --yellow-d:#c79a00;
  --blue:#2f7cff; --blue-d:#1747b5; --green:#2fc65a; --green-d:#16883a;
  --ink:#1b1b3a; --white:#fff;
}
*{box-sizing:border-box;margin:0}
body{font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink);background:#7fd0ff;min-height:100vh;overflow-x:hidden}
.display{font-family:'Lilita One','Baloo 2',sans-serif;letter-spacing:.02em}
#scene{position:fixed;inset:0;z-index:0;display:block;width:100%;height:100%}

/* ---------- header ---------- */
header{position:relative;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:16px 24px}
.mini-logo{font-size:30px;color:var(--yellow);-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);text-decoration:none}

/* ---------- buttons ---------- */
.btn{
  --c:var(--red);--d:var(--red-d);
  font-family:'Lilita One',sans-serif;font-size:20px;color:#fff;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 70%,#fff) 0%,var(--c) 45%);
  border:4px solid var(--ink);border-radius:16px;padding:8px 22px;cursor:pointer;
  box-shadow:0 7px 0 var(--d),0 7px 0 4px var(--ink);
  transition:transform .08s,box-shadow .08s;text-shadow:0 2px 0 var(--d);letter-spacing:.03em;
}
.btn:hover{transform:translateY(-3px);box-shadow:0 10px 0 var(--d),0 10px 0 4px var(--ink)}
.btn:active{transform:translateY(6px);box-shadow:0 1px 0 var(--d),0 1px 0 4px var(--ink)}
.btn.yellow{--c:var(--yellow);--d:var(--yellow-d);color:var(--ink);text-shadow:none}
.btn.blue{--c:var(--blue);--d:var(--blue-d)}
.btn.green{--c:var(--green);--d:var(--green-d)}

/* ---------- hero ---------- */
main{position:relative;z-index:2;max-width:1100px;margin:0 auto;padding:10px 24px 60px;text-align:center}
.logo{
  font-size:clamp(70px,14vw,150px);line-height:1;color:var(--yellow);display:inline-block;
  -webkit-text-stroke:7px var(--ink);paint-order:stroke fill;
  text-shadow:0 4px 0 var(--ink),0 8px 0 var(--ink),0 12px 0 var(--ink),0 20px 18px #0005;
  transform:perspective(600px) rotateX(14deg) rotate(-2deg);
}
.logo span{display:inline-block;animation:hop 2.4s ease-in-out infinite}
.logo span:nth-child(2n){color:var(--red);animation-delay:.15s}
.logo span:nth-child(3n){color:var(--white);animation-delay:.3s}
.logo .cowO{width:.92em;height:.92em;vertical-align:-.06em;margin:0 .02em;filter:drop-shadow(0 6px 0 #1b1b3a) drop-shadow(0 10px 12px #0004);animation-delay:.45s}
.logo .cowO svg{width:100%;height:100%;display:block}
@keyframes hop{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-16px)}}
.tag{display:inline-block;font-size:clamp(18px,2.6vw,24px);font-weight:800;margin:18px 0 34px;background:#fff;border:4px solid var(--ink);border-radius:999px;padding:4px 22px;box-shadow:0 6px 0 var(--ink)}

/* ---------- game grid: wide 2 columns, 3D tilt cards ---------- */
.games{display:grid;grid-template-columns:repeat(2,1fr);gap:28px;perspective:1200px}
.game{
  --bg:var(--red);position:relative;display:flex;flex-direction:column;text-align:left;padding:0;overflow:visible;
  border:5px solid var(--ink);border-radius:26px;cursor:pointer;color:#fff;background:var(--bg);
  box-shadow:0 10px 0 var(--ink),0 22px 24px #0004;transform-style:preserve-3d;transition:transform .15s,box-shadow .15s;
  font-family:'Lilita One',sans-serif;font-size:30px;
}
.game:hover,.game.focus{box-shadow:0 14px 0 var(--ink),0 30px 30px #0005}
.game.focus{outline:6px solid var(--yellow);outline-offset:5px}
.game .cover{display:block;aspect-ratio:400/220;border-radius:21px 21px 0 0;overflow:hidden;border-bottom:5px solid var(--ink);transform:translateZ(20px)}
.game .cover svg{display:block;width:100%;height:100%}
.game .bar{display:flex;align-items:center;padding:12px 18px 14px;background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 70%,#fff),var(--bg) 50%);border-radius:0 0 21px 21px;transform:translateZ(30px)}
.game .txt{text-shadow:0 3px 0 #0004}
.game small{display:block;font-family:'Baloo 2';font-weight:800;font-size:16px;opacity:.95;text-shadow:none}
.game .play{margin-left:auto;width:54px;height:54px;flex:none;border-radius:50%;background:var(--yellow);border:4px solid var(--ink);display:grid;place-items:center;color:var(--ink);font-size:22px;box-shadow:0 5px 0 var(--yellow-d)}
.game .soon{position:absolute;top:-16px;right:20px;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:12px;font-size:16px;padding:2px 12px;transform:translateZ(50px) rotate(5deg)}
.game.soon-card .cover{filter:saturate(.75)}
.games .game:last-child:nth-child(odd){grid-column:1/-1;max-width:calc(50% - 14px);justify-self:center;width:100%}
.controls-hint{margin-top:30px;font-weight:800;background:#fffd;display:inline-block;padding:6px 18px;border-radius:14px;border:3px solid var(--ink)}
kbd{font-family:'Lilita One';background:#fff;border:2px solid var(--ink);border-bottom-width:4px;border-radius:6px;padding:0 6px}

/* ---------- QR popup (right side) ---------- */
.qr-pop{
  position:fixed;right:22px;top:50%;z-index:5;width:250px;background:#fff;border:5px solid var(--ink);border-radius:24px;
  padding:16px 16px 18px;text-align:center;box-shadow:0 10px 0 var(--ink),0 24px 30px #0004;
  transform:translate(0,-50%);transition:transform .35s cubic-bezier(.5,1.6,.5,1);
}
.qr-pop.hide{transform:translate(calc(100% + 40px),-50%)}
.qr-pop h3{font-size:24px}
.qr-pop .close{position:absolute;top:-16px;left:-16px;width:40px;height:40px;padding:0;border-radius:50%;font-size:20px}
.qr{width:170px;height:170px;margin:8px auto;border-radius:12px;border:3px solid var(--ink);background:#fff}
.qr img{width:100%;height:100%;display:block}
.padurl{font-weight:800;font-size:12px;word-break:break-all;opacity:.75;margin-bottom:2px}
.pin{font-family:'Lilita One';font-size:32px;letter-spacing:.15em;color:var(--blue)}
.status{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.dot{width:13px;height:13px;border-radius:50%;background:var(--yellow);border:3px solid var(--ink);animation:pulse 1s infinite}
.status.ok .dot{background:var(--green);animation:none}
@keyframes pulse{50%{transform:scale(1.35)}}
.qr-pop.connected{background:#eaffd9}
.nophone{margin-top:10px;font-size:14px;font-weight:800;border-top:3px dashed #1b1b3a33;padding-top:8px}
.nophone a{color:var(--blue);cursor:pointer}
.phone-tab{position:fixed;right:0;top:50%;z-index:4;transform:translateY(-50%);border-radius:16px 0 0 16px;border-right:none;padding:14px 12px;font-size:28px}

/* ---------- footer ---------- */
footer{position:relative;z-index:2;background:#8a5a2b;border-top:6px solid var(--ink);color:#fff;padding:22px 24px 26px;
  background-image:repeating-linear-gradient(90deg,#00000014 0 60px,transparent 60px 120px)}
footer::before{content:"";position:absolute;left:0;right:0;top:-26px;height:20px;
  background:repeating-linear-gradient(90deg,#fff 0 16px,transparent 16px 80px);border-bottom:5px solid #fff}
.foot{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}
.foot nav{display:flex;gap:14px;flex-wrap:wrap}
.foot .btn{font-size:17px;padding:6px 16px}
.foot p{font-weight:800;opacity:.9}

/* ---------- modal + toast ---------- */
.modal{position:fixed;inset:0;z-index:20;background:#1b1b3a99;display:none;place-items:center;padding:20px}
.modal.open{display:grid}
.card{background:#fff;border:5px solid var(--ink);border-radius:26px;box-shadow:0 10px 0 var(--ink);padding:26px;max-width:420px;width:100%;text-align:center;animation:pop .3s cubic-bezier(.5,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6)}}
.card h2{font-size:34px;margin-bottom:10px}
.card p{font-weight:600;margin-bottom:14px;text-align:left}
.card input{width:100%;font:inherit;font-weight:800;border:4px solid var(--ink);border-radius:14px;padding:10px 14px;margin-bottom:12px}
.card .row{display:flex;gap:12px;justify-content:center;margin-top:8px}
.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,140px);z-index:30;background:var(--ink);color:#fff;font-family:'Lilita One';font-size:22px;padding:12px 26px;border-radius:16px;border:4px solid #fff;transition:transform .25s}
.toast.show{transform:translate(-50%,0)}

.air{position:fixed;left:0;top:0;z-index:40;width:48px;height:48px;margin:-24px 0 0 -24px;pointer-events:none;opacity:0;transition:opacity .3s;filter:drop-shadow(0 5px 0 #1b1b3a66)}
.air.on{opacity:1}
.air svg{width:100%;height:100%;display:block;transition:transform .12s}
.air.hot svg{transform:scale(1.35)}
.air.click svg{transform:scale(.75)}
.air-hover{outline:5px solid var(--yellow)!important;outline-offset:4px}
/* ---------- camera assist ---------- */
.cam-btn.on{--c:var(--green)}
.cam-btn:not(.on){--c:#8a8aa0;--d:#55556a}
.cam-txt{font-size:13px;font-weight:800;opacity:.7;margin-top:4px}
.cam-preview{position:fixed;right:14px;bottom:14px;width:160px;border:4px solid var(--ink);border-radius:14px;transform:scaleX(-1);z-index:17;display:none;box-shadow:0 5px 0 var(--ink)}
body.cam-on .cam-preview{display:block}
/* ---------- game stage ---------- */
.stage{position:fixed;inset:0;z-index:15;background:#0b0b18;display:none}
body.playing .stage{display:block}
body.playing{overflow:hidden}
body.playing main, body.playing header, body.playing footer, body.playing #scene, body.playing .air{visibility:hidden}
.stage-frame, .stage-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.stage-bar{position:absolute;top:14px;left:14px;display:flex;gap:12px;transform:translateY(-120%);opacity:0;transition:transform .25s,opacity .25s;pointer-events:none}
.stage-bar.show, .stage-bar:focus-within{transform:none;opacity:1;pointer-events:auto}
.stage-bar .btn{font-size:17px;padding:6px 16px}
.stage-phone{display:inline-flex;align-items:center;gap:8px}
.stage-phone .dot{width:12px;height:12px;border-radius:50%;background:var(--yellow);border:3px solid var(--ink)}
.stage-phone.ok .dot{background:var(--green)}
body.playing .qr-pop{z-index:16}
body.playing .toast{z-index:31}
@media (max-width:760px){
  .games{grid-template-columns:1fr}
  .games .game:last-child:nth-child(odd){max-width:none}
  .qr-pop{top:auto;bottom:16px;right:16px;transform:none}
  .qr-pop.hide{transform:translateX(calc(100% + 40px))}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>

<body>
<canvas id="scene" aria-hidden="true"></canvas>

<header>
  <a class="mini-logo display" href="/">EXEMOO</a>
  <button class="btn yellow" id="loginBtn"><svg width="20" height="20" viewBox="0 0 24 24" style="vertical-align:-3px;margin-right:6px" fill="currentColor"><circle cx="12" cy="8" r="5"/><path d="M3 22a9 9 0 0 1 18 0z"/></svg>Log in</button>
</header>

<main>
  <h1 class="logo display" aria-label="Exemoo"><span>E</span><span>X</span><span>E</span><span>M</span><span class="cowO" aria-hidden="true"><svg viewBox="0 0 120 120"><g stroke="#1b1b3a" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
<path d="M26 34 L14 10 L38 24Z M94 34 L106 10 L82 24Z" fill="#f3e3b5"/>
<ellipse cx="14" cy="50" rx="16" ry="9" fill="#fff" transform="rotate(-20 14 50)"/><ellipse cx="106" cy="50" rx="16" ry="9" fill="#fff" transform="rotate(20 106 50)"/>
<ellipse cx="60" cy="58" rx="42" ry="44" fill="#fff"/>
<path d="M30 30 q14 -6 22 8 q-4 16 -20 12 q-8 -8 -2 -20z" fill="#1b1b3a"/>
<ellipse cx="60" cy="86" rx="34" ry="22" fill="#ffa8b8"/>
<ellipse cx="48" cy="86" rx="5" ry="7" fill="#1b1b3a"/><ellipse cx="72" cy="86" rx="5" ry="7" fill="#1b1b3a"/>
<ellipse cx="44" cy="52" rx="8" ry="11" fill="#fff"/><ellipse cx="76" cy="52" rx="8" ry="11" fill="#fff"/></g>
<circle cx="46" cy="54" r="5" fill="#1b1b3a"/><circle cx="78" cy="54" r="5" fill="#1b1b3a"/><circle cx="48" cy="51" r="1.8" fill="#fff"/><circle cx="80" cy="51" r="1.8" fill="#fff"/></svg></span><span>O</span></h1>
  <br><p class="tag">Move your phone. Play the game.</p>

  <section class="games" id="games">
    <button class="game" style="--bg:#2fc65a" data-g="Fruit Slice" data-id="fruit-slice"><span class="cover" data-cover="fruit"></span><span class="bar"><span class="txt">Fruit Slice<small>Slash flying fruit</small></span><span class="play">▶</span></span></button>
    <button class="game" style="--bg:#ff3b30" data-g="Table Tennis" data-id="table-tennis"><span class="cover" data-cover="tt"></span><span class="bar"><span class="txt">Table Tennis<small>Swing to smash</small></span><span class="play">▶</span></span></button>
    <button class="game" style="--bg:#9b4dff" data-g="Pose Match" data-id="pose-match"><span class="cover" data-cover="pose"></span><span class="bar"><span class="txt">Pose Match<small>Strike the pose</small></span><span class="play">▶</span></span></button>
    <button class="game" style="--bg:#ff8a00" data-g="Tennis" data-id="tennis"><span class="cover" data-cover="tennis"></span><span class="bar"><span class="txt">Tennis<small>Serve &amp; volley</small></span><span class="play">▶</span></span></button>
    <button class="game" style="--bg:#2f7cff" data-g="Farm Dash" data-id="farm-dash"><span class="cover" data-cover="runner"></span><span class="bar"><span class="txt">Farm Dash<small>Lean, jump, dodge</small></span><span class="play">▶</span></span></button>
    <button class="game" style="--bg:#16a3d9" data-g="Golf" data-id="golf"><span class="cover" data-cover="golf"></span><span class="bar"><span class="txt">Golf<small>Nail the putt</small></span><span class="play">▶</span></span></button>
    <button class="game" style="--bg:#16a085" data-g="Cricket" data-id="cricket"><span class="cover" data-cover="cricket"></span><span class="bar"><span class="txt">Cricket<small>Swing for six</small></span><span class="play">▶</span></span></button>
  </section>

  <p class="controls-hint">No phone? <kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> + <kbd>Enter</kbd> or just click.</p>
</main>

<!-- QR pairing popup -->
<aside class="qr-pop hide" id="qrPop" aria-label="Pair your phone">
  <button class="btn close" id="qrClose" aria-label="Close">&times;</button>
  <h3 class="display">Use phone as controller</h3>
  <div class="qr" id="qr"></div>
  <div class="padurl" id="padUrl"></div>
  <div class="pin" id="pin">······</div>
  <div class="status" id="status"><i class="dot"></i><span id="stxt">Getting ready…</span></div>
  <button class="btn green cam-btn" data-cam-toggle style="margin-top:10px;font-size:16px">Camera assist</button>
  <p class="cam-txt" id="camTxt">Camera off</p>
  <div class="nophone">No phone? <a id="useKb">Play with keyboard &amp; mouse</a></div>
</aside>
<button class="btn blue phone-tab hide" id="phoneTab" aria-label="Pair phone" style="display:none"><svg width="26" height="32" viewBox="0 0 26 32" aria-hidden="true"><rect x="3" y="2" width="20" height="28" rx="4" fill="#fff" stroke="#1b1b3a" stroke-width="3"/><rect x="7" y="6" width="12" height="17" rx="2" fill="#bfe8ff"/><circle cx="13" cy="26" r="1.6" fill="#1b1b3a"/></svg></button>

<footer>
  <div class="foot">
    <nav>
      <a class="btn green" href="/how.html" style="text-decoration:none">How it works</a>
      <button class="btn blue" data-modal="contact">Contact us</button>
      <button class="btn yellow" data-modal="terms">Terms &amp; Conditions</button>
      <a class="btn" href="#/play/pad-test" style="text-decoration:none">Test controller</a>
    </nav>
    <p>© 2026 Exemoo · Moo-ve to play</p>
  </div>
</footer>

<!-- game stage: a full-screen iframe at /play/<id>/ -->
<section class="stage" id="stage" aria-label="Game">
  <div class="stage-frame" id="stageFrame"></div>
  <div class="stage-bar" id="stageBar">
    <button class="btn yellow" id="stageMenu">&larr; Menu</button>
    <button class="btn blue stage-phone" id="stagePhone"><i class="dot"></i><span id="stagePhoneTxt">Pair phone</span></button>
    <button class="btn green cam-btn" data-cam-toggle>Camera assist</button>
  </div>
</section>

<div class="modal" id="modal"><div class="card" id="modalCard"></div></div>
<div class="toast display" id="toast"></div>
<video id="camVideo" class="cam-preview" playsinline muted aria-hidden="true"></video>
<div class="air" id="air" aria-hidden="true"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="18" fill="#ffd21f" stroke="#1b1b3a" stroke-width="5"/><circle cx="24" cy="24" r="6" fill="#1b1b3a"/></svg></div>

<script type="module" src="/scene.js"></script>
<script type="module">
import { covers } from '/covers.js';
document.querySelectorAll('.game [data-cover]').forEach(el => el.innerHTML = covers[el.dataset.cover]);
</script>

<script type="module" src="/js/shell.js"></script>
</body>
</html>
