<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Top arc for FARMYARD text -->
    <path id="textArcTop" d="M 30,128 A 98,98 0 1,1 226,128" fill="none"/>
    <!-- Bottom arc for CC / CRICKET CLUB text -->
    <path id="textArcBottom" d="M 34,128 A 94,94 0 0,0 222,128" fill="none"/>
  </defs>

  <!-- Outer Badge Trim -->
  <circle cx="128" cy="128" r="122" fill="#ffd21f" stroke="#ff3b30" stroke-width="8"/>
  <circle cx="128" cy="128" r="117" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>

  <!-- Inner Crest Ring & Background -->
  <circle cx="128" cy="128" r="88" fill="#ffffff" stroke="#ff3b30" stroke-width="5"/>
  <circle cx="128" cy="128" r="82" fill="none" stroke="#ffd21f" stroke-width="2.5"/>

  <!-- Circular Text -->
  <text fill="#ff3b30" font-family="Arial Black, Arial, sans-serif" font-size="20.5" font-weight="900" letter-spacing="4">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">FARMYARD</textPath>
  </text>
  <text fill="#ff3b30" font-family="Arial Black, Arial, sans-serif" font-size="11.5" font-weight="900" letter-spacing="3.5">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">CRICKET CLUB</textPath>
  </text>

  <!-- Flanking Stars on Outer Ring -->
  <polygon points="26,128 28.5,122 34,124 30.5,128.5 33,133.5 27.5,131.5" fill="#ff3b30"/>
  <polygon points="230,128 227.5,122 222,124 225.5,128.5 223,133.5 228.5,131.5" fill="#ff3b30"/>

  <!-- Inner Graphic: Cricket Ground Arc -->
  <path d="M 68,188 Q 128,178 188,188" stroke="#ff3b30" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Cricket Ball (Base Center) -->
  <g id="cricket-ball">
    <circle cx="128" cy="184" r="14" fill="#ff3b30"/>
    <path d="M 120,173 C 127,178 129,190 120,195" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="2,1.5"/>
    <circle cx="128" cy="184" r="14" fill="none" stroke="#ff3b30" stroke-width="1.5"/>
  </g>

  <!-- Three Cricket Stumps -->
  <g id="stumps" fill="#ffd21f" stroke="#ff3b30" stroke-width="2.5" stroke-linejoin="round">
    <!-- Left Stump -->
    <rect x="110" y="128" width="6.5" height="50" rx="2"/>
    <!-- Middle Stump -->
    <rect x="124.75" y="124" width="6.5" height="50" rx="2"/>
    <!-- Right Stump -->
    <rect x="139.5" y="128" width="6.5" height="50" rx="2"/>
    <!-- Bails -->
    <rect x="108" y="123" width="18" height="3.5" rx="1.5" fill="#ff3b30"/>
    <rect x="129" y="123" width="18" height="3.5" rx="1.5" fill="#ff3b30"/>
  </g>

  <!-- Stylised Rooster Emblem Over Stumps -->
  <g id="rooster">
    <!-- Tail Feathers (Sickles) -->
    <!-- Feather 1 (Top sweeping) -->
    <path d="M 118,108 C 96,82 72,66 58,78 C 52,83 58,102 78,110 C 95,116 112,116 118,114 Z" fill="#ff3b30"/>
    <path d="M 112,104 C 94,84 76,74 65,82 C 60,86 68,99 82,106 C 96,112 108,110 112,104 Z" fill="#ffd21f"/>

    <!-- Feather 2 (Mid sickle) -->
    <path d="M 114,115 C 88,100 66,98 56,110 C 50,117 64,126 82,126 C 96,126 110,121 116,117 Z" fill="#ff3b30"/>
    <path d="M 108,115 C 88,105 72,104 65,112 C 61,117 72,122 84,122 C 95,122 104,118 108,115 Z" fill="#ffffff"/>

    <!-- Feather 3 (Lower sickle) -->
    <path d="M 116,122 C 95,118 75,122 68,135 C 65,141 78,143 90,138 C 102,133 112,127 116,122 Z" fill="#ffd21f" stroke="#ff3b30" stroke-width="1.5"/>

    <!-- Rooster Legs & Spurs (perched on bails) -->
    <path d="M 120,122 L 118,127 L 112,127 M 118,127 L 122,127" stroke="#ff3b30" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 132,120 L 134,127 L 129,127 M 134,127 L 138,127" stroke="#ff3b30" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Main Body & Puffed Chest -->
    <path d="M 112,118 C 114,124 122,128 132,124 C 144,119 153,108 152,94 C 151,84 144,79 138,76 L 132,68 L 128,78 C 122,81 118,87 117,94 C 116,99 110,105 112,118 Z" fill="#ff3b30"/>

    <!-- Stylised Wing Layer -->
    <path d="M 118,105 C 122,116 132,118 142,108 C 146,103 147,94 138,91 C 127,88 120,95 118,105 Z" fill="#ffd21f"/>
    <path d="M 122,106 C 125,113 133,114 139,107 C 140,103 137,98 132,96 C 126,94 123,99 122,106 Z" fill="#ffffff"/>

    <!-- Rooster Neck Hackles -->
    <path d="M 132,73 L 140,84 L 133,85 L 142,94 L 130,95 L 126,88 Z" fill="#ffd21f"/>

    <!-- Rooster Head -->
    <path d="M 132,69 C 133,65 137,63 143,65 C 148,67 150,71 149,76 C 145,80 137,81 133,76 Z" fill="#ff3b30"/>

    <!-- Crown / Comb (3 Flame Tips) -->
    <path d="M 135,64 C 133,54 139,52 141,56 C 143,51 149,50 149,56 C 152,52 157,54 155,61 C 153,65 147,66 142,65 Z" fill="#ff3b30"/>
    <path d="M 137,63 C 136,57 140,55 141,58 C 143,54 147,53 147,58 C 149,55 153,56 152,61 Z" fill="#ffd21f"/>

    <!-- Wattle -->
    <path d="M 147,77 C 151,78 153,83 151,87 C 148,91 144,89 144,83 Z" fill="#ff3b30"/>

    <!-- Sharp Beak -->
    <polygon points="148,70 160,74 147,77" fill="#ffd21f" stroke="#ff3b30" stroke-width="1" stroke-linejoin="round"/>

    <!-- Eye (Aggressive Sports Style) -->
    <circle cx="142" cy="70" r="3" fill="#ffffff"/>
    <circle cx="143" cy="70" r="1.5" fill="#1a1a1a"/>
  </g>
</svg>