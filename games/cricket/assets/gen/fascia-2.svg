<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 128" width="2048" height="128">
  <defs>
    <!-- Seamless background sports texture (64px width divides 2048 evenly: exactly 32 repeats) -->
    <pattern id="sport-stripe" width="64" height="128" patternUnits="userSpaceOnUse">
      <polygon points="0,0 24,0 8,128 -16,128" fill="#e82f25" opacity="0.45"/>
      <polygon points="32,0 56,0 40,128 16,128" fill="#e82f25" opacity="0.45"/>
    </pattern>

    <!-- 5-Point Gold Star -->
    <g id="star-gold">
      <polygon points="0,-13 3.8,-3.9 12.4,-3.9 5.5,1.7 8.1,10.5 0,5 -8.1,10.5 -5.5,1.7 -12.4,-3.9 -3.8,-3.9" 
               fill="#ffd60a" stroke="#101014" stroke-width="2.2" stroke-linejoin="round"/>
    </g>

    <!-- Small 5-Point Gold Star -->
    <g id="star-small">
      <polygon points="0,-8 2.4,-2.4 7.6,-2.4 3.4,1 5,6.5 0,3.1 -5,6.5 -3.4,1 -7.6,-2.4 -2.4,-2.4" 
               fill="#ffd60a" stroke="#101014" stroke-width="1.8" stroke-linejoin="round"/>
    </g>

    <!-- 4-Point Diamond Spark -->
    <g id="diamond-spark">
      <polygon points="0,-16 3.5,-3.5 16,0 3.5,3.5 0,16 -3.5,3.5 -16,0 -3.5,-3.5" 
               fill="#ffffff" stroke="#101014" stroke-width="2" stroke-linejoin="round"/>
    </g>

    <!-- Standalone Cricket Ball -->
    <g id="cricket-ball">
      <circle cx="0" cy="0" r="19" fill="#b80007" stroke="#101014" stroke-width="3"/>
      <!-- Ball Sheen Accent -->
      <path d="M -13 -8 A 15 15 0 0 1 -4 -16" stroke="#ff6b72" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <!-- Seam Arc -->
      <path d="M 0 -19 A 9 19 0 0 1 0 19" fill="none" stroke="#ffffff" stroke-width="2.5"/>
      <!-- Stitches -->
      <line x1="-3.5" y1="-13" x2="2.5" y2="-11" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="-4" y1="-7" x2="3" y2="-5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="-4.5" y1="-1" x2="3" y2="1" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="-4" y1="5" x2="3" y2="7" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="-3.5" y1="11" x2="2.5" y2="13" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- Single Cricket Bat -->
    <g id="single-bat">
      <!-- Handle Top Grip Wrap -->
      <rect x="-3" y="-44" width="6" height="5" rx="1.5" fill="#ffd60a" stroke="#101014" stroke-width="2"/>
      <!-- Handle -->
      <rect x="-2.5" y="-39" width="5" height="19" rx="1" fill="#f4f4f6" stroke="#101014" stroke-width="2"/>
      <line x1="-2.5" y1="-32" x2="2.5" y2="-32" stroke="#101014" stroke-width="1.5"/>
      <line x1="-2.5" y1="-26" x2="2.5" y2="-26" stroke="#101014" stroke-width="1.5"/>
      <!-- Blade -->
      <path d="M -2.5 -20 L -6.5 -13 L -6 28 C -6 34 0 35 0 35 C 0 35 6 34 6 28 L 6.5 -13 L 2.5 -20 Z" 
            fill="#ffeaad" stroke="#101014" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- Wood Grain Highlight -->
      <line x1="0" y1="-12" x2="0" y2="28" stroke="#dfc278" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- Full Cricket Trophy Crest Motif -->
    <g id="cricket-crest">
      <!-- Crest Backdrop Shield -->
      <polygon points="0,-48 46,-32 38,24 0,46 -38,24 -46,-32" 
               fill="#9b0e12" stroke="#ffd60a" stroke-width="3" stroke-linejoin="round"/>
      <polygon points="0,-42 40,-28 32,20 0,40 -32,20 -40,-28" 
               fill="#78080c" opacity="0.6"/>

      <!-- Crossed Bats -->
      <g transform="rotate(-38)">
        <use href="#single-bat"/>
      </g>
      <g transform="rotate(38)">
        <use href="#single-bat"/>
      </g>

      <!-- Stumps & Bails -->
      <!-- Stumps -->
      <rect x="-14" y="-12" width="5.5" height="42" rx="2" fill="#ffffff" stroke="#101014" stroke-width="2.2"/>
      <rect x="-2.75" y="-12" width="5.5" height="42" rx="2" fill="#ffffff" stroke="#101014" stroke-width="2.2"/>
      <rect x="8.5" y="-12" width="5.5" height="42" rx="2" fill="#ffffff" stroke="#101014" stroke-width="2.2"/>
      <!-- Bails -->
      <rect x="-16.5" y="-16.5" width="14" height="4" rx="1.5" fill="#ffd60a" stroke="#101014" stroke-width="2"/>
      <rect x="2.5" y="-16.5" width="14" height="4" rx="1.5" fill="#ffd60a" stroke="#101014" stroke-width="2"/>

      <!-- Center Ball on Crest -->
      <g transform="translate(0, 18) scale(0.72)">
        <use href="#cricket-ball"/>
      </g>
    </g>

    <!-- Left/Right Tiling Boundary Joint (half rendered at x=0, half at x=2048) -->
    <g id="boundary-joint">
      <!-- Vertical Divider Lines -->
      <line x1="0" y1="12" x2="0" y2="116" stroke="#ffd60a" stroke-width="3" stroke-linecap="round"/>
      <line x1="-12" y1="20" x2="-12" y2="108" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
      <line x1="12" y1="20" x2="12" y2="108" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
      <!-- Central Rosette Joint -->
      <circle cx="0" cy="64" r="14" fill="#ff3b30" stroke="#101014" stroke-width="2.5"/>
      <polygon points="0,52 3.5,60.5 12,64 3.5,67.5 0,76 -3.5,67.5 -12,64 -3.5,60.5" 
               fill="#ffd60a" stroke="#101014" stroke-width="1.8" stroke-linejoin="round"/>
      <!-- Secondary End Dots -->
      <circle cx="0" cy="24" r="4" fill="#ffffff" stroke="#101014" stroke-width="1.5"/>
      <circle cx="0" cy="104" r="4" fill="#ffffff" stroke="#101014" stroke-width="1.5"/>
    </g>
  </defs>

  <!-- Base Stadium Red Background -->
  <rect x="0" y="0" width="2048" height="128" fill="#ff3b30"/>

  <!-- Repeated Broadcast Speed Angled Texture -->
  <rect x="0" y="0" width="2048" height="128" fill="url(#sport-stripe)"/>

  <!-- Modern Sports Banner Horizontal Framing Bars -->
  <!-- Subtle dark shade strips -->
  <rect x="0" y="0" width="2048" height="12" fill="#101014" opacity="0.22"/>
  <rect x="0" y="116" width="2048" height="12" fill="#101014" opacity="0.22"/>

  <!-- Crisp Light Outer Border Stripes (Continuous for Seamless Tile) -->
  <rect x="0" y="0" width="2048" height="5" fill="#ff7f77"/>
  <rect x="0" y="5" width="2048" height="2.5" fill="#ffffff" opacity="0.95"/>
  <rect x="0" y="120.5" width="2048" height="2.5" fill="#ffffff" opacity="0.95"/>
  <rect x="0" y="123" width="2048" height="5" fill="#ff7f77"/>

  <!-- Outer Pin Stripes -->
  <line x1="0" y1="12" x2="2048" y2="12" stroke="#ffd60a" stroke-width="1.2" opacity="0.8"/>
  <line x1="0" y1="116" x2="2048" y2="116" stroke="#ffd60a" stroke-width="1.2" opacity="0.8"/>

  <!-- ==================== LEFT-TO-RIGHT TILING SEAM NODES ==================== -->
  <!-- Placed exactly at x=0 and x=2048 so when placed side-by-side they complete seamlessly -->
  <use href="#boundary-joint" x="0" y="0"/>
  <use href="#boundary-joint" x="2048" y="0"/>

  <!-- ==================== LEFT FLANK MOTIFS ==================== -->
  <!-- Flanking Stars near boundary seam -->
  <use href="#star-small" x="52" y="64"/>
  <use href="#star-gold" x="106" y="64"/>
  <use href="#diamond-spark" x="162" y="64"/>
  <use href="#star-small" x="216" y="64"/>

  <!-- Cricket Ball Emblem (Left) -->
  <g transform="translate(286, 64)">
    <!-- Radiating Chevrons -->
    <path d="M -30 -10 L -38 0 L -30 10" stroke="#ffd60a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 30 -10 L 38 0 L 30 10" stroke="#ffd60a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <use href="#cricket-ball"/>
  </g>

  <!-- Stars between Ball and Main Crest -->
  <use href="#star-small" x="356" y="64"/>
  <use href="#star-gold" x="404" y="64"/>

  <!-- Main Cricket Crest: Stumps, Crossed Bats, Ball (Left) -->
  <use href="#cricket-crest" x="504" y="64"/>

  <!-- Transition Accents into Center Title -->
  <use href="#star-gold" x="604" y="64" transform="scale(1.15) translate(-78, -8)"/>
  <use href="#diamond-spark" x="654" y="64"/>
  <use href="#star-gold" x="696" y="64"/>

  <!-- Left Inner Broadcast Chevron Accents -->
  <polygon points="726,44 736,44 748,64 736,84 726,84 738,64" fill="#ffffff" opacity="0.85"/>
  <polygon points="742,44 752,44 764,64 752,84 742,84 754,64" fill="#ffd60a"/>

  <!-- ==================== CENTER TITLE: EXEMOO PAVILION ==================== -->
  <!-- Solid Dark Drop Shadow / Extrusion -->
  <text x="1024" y="87" 
        text-anchor="middle" 
        font-family="Arial Black, Arial, sans-serif" 
        font-size="62" 
        font-weight="900" 
        letter-spacing="5" 
        fill="#101014" 
        stroke="#101014" 
        stroke-width="8" 
        stroke-linejoin="round">EXEMOO PAVILION</text>

  <!-- Deep Scarlet Stroke Layer for Broadcast Edge Depth -->
  <text x="1024" y="82" 
        text-anchor="middle" 
        font-family="Arial Black, Arial, sans-serif" 
        font-size="62" 
        font-weight="900" 
        letter-spacing="5" 
        fill="#101014" 
        stroke="#78080c" 
        stroke-width="12" 
        stroke-linejoin="round">EXEMOO PAVILION</text>

  <!-- Primary Crisp White Title with Sharp Dark Contour -->
  <text x="1024" y="82" 
        text-anchor="middle" 
        font-family="Arial Black, Arial, sans-serif" 
        font-size="62" 
        font-weight="900" 
        letter-spacing="5" 
        fill="#ffffff" 
        stroke="#101014" 
        stroke-width="6.5" 
        stroke-linejoin="round"
        paint-order="stroke fill">EXEMOO PAVILION</text>

  <!-- Modern Accent Bars under / above Text Center -->
  <line x1="830" y1="23" x2="1218" y2="23" stroke="#ffd60a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="910" y1="99" x2="1138" y2="99" stroke="#ffd60a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ==================== RIGHT FLANK MOTIFS (SYMMETRIC TO LEFT) ==================== -->
  <!-- Right Inner Broadcast Chevron Accents -->
  <polygon points="1322,44 1312,44 1300,64 1312,84 1322,84 1310,64" fill="#ffffff" opacity="0.85"/>
  <polygon points="1306,44 1296,44 1284,64 1296,84 1306,84 1294,64" fill="#ffd60a"/>

  <!-- Transition Accents out of Center Title -->
  <use href="#star-gold" x="1352" y="64"/>
  <use href="#diamond-spark" x="1394" y="64"/>
  <use href="#star-gold" x="1444" y="64" transform="scale(1.15) translate(-188, -8)"/>

  <!-- Main Cricket Crest: Stumps, Crossed Bats, Ball (Right) -->
  <use href="#cricket-crest" x="1544" y="64"/>

  <!-- Stars between Crest and Ball -->
  <use href="#star-gold" x="1644" y="64"/>
  <use href="#star-small" x="1692" y="64"/>

  <!-- Cricket Ball Emblem (Right) -->
  <g transform="translate(1762, 64)">
    <!-- Radiating Chevrons -->
    <path d="M -30 -10 L -38 0 L -30 10" stroke="#ffd60a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 30 -10 L 38 0 L 30 10" stroke="#ffd60a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <use href="#cricket-ball"/>
  </g>

  <!-- Flanking Stars near boundary seam -->
  <use href="#star-small" x="1832" y="64"/>
  <use href="#diamond-spark" x="1886" y="64"/>
  <use href="#star-gold" x="1942" y="64"/>
  <use href="#star-small" x="1996" y="64"/>
</svg>