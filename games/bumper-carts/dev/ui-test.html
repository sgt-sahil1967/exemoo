<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bumper Carts UI test</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../ui.css">
<style>
html,body{height:100%;margin:0;background:radial-gradient(circle at 50% 60%,#f6d08a 0 30%,#9a6a3a 31%);font-family:'Baloo 2',sans-serif}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#1b1b3a;padding:6px;display:flex;gap:6px;flex-wrap:wrap}
#bar button{font:700 13px 'Baloo 2';padding:3px 10px;border-radius:8px;border:0;cursor:pointer}
#log{position:fixed;right:6px;bottom:44px;z-index:50;background:#fffc;font:12px monospace;padding:4px;max-width:260px;white-space:pre-wrap}
</style>
</head>
<body>
<div id="ui"></div>
<div id="bar"></div>
<div id="log"></div>
<script type="module">
import { createUI } from '../js/ui.js';
const ui = createUI({ root: document.getElementById('ui') });
const log = (m) => { const l = document.getElementById('log'); l.textContent = (m + '\n' + l.textContent).slice(0, 400); };
['start','pause','resume','restart','exit','mute','again','changePlayers','lobbyReady','lobbyBack'].forEach((e) => ui.on(e, (a) => log(e + (a ? ' ' + JSON.stringify(a) : ''))));
const names = ['Red Cow', 'Blue Pig', 'Green Sheep', 'Yellow Chick'], colors = ['#ff3b30', '#2f7cff', '#2fc65a', '#ffd21f'];
const seats = (o = {}) => names.map((name, i) => ({ name, color: colors[i], score: [3, 1, 2, 0][i], state: 'drive', cpu: i > 0, ...(o[i] || {}) }));
const hud = (o = {}) => ui.hud({ seats: seats(), timeLeft: 62, storm: false, sudden: false, ...o });
const cards = [
  { label: names[0], color: colors[0], joined: true, connected: true, note: 'Uses your Exemoo phone', keysHelp: 'W A S D + Space', cpu: true },
  { label: names[1], color: colors[1], joined: false, connected: false, pin: '123456', url: '192.168.1.5:8443/pad', qrSrc: '', keysHelp: 'arrows + Enter', cpu: true },
  { label: names[2], color: colors[2], joined: true, connected: false, keysHelp: 'I J K L + U', cpu: true },
  { label: names[3], color: colors[3], joined: false, connected: false, pin: '654321', url: '192.168.1.5:8443/pad', qrSrc: '', keysHelp: 'numpad 8 4 5 6 + 0', cpu: true },
];
const steps = {
  Title: () => ui.showTitle(),
  Lobby: () => ui.showLobby(cards, { note: 'Empty seats are filled by CPU carts.', canStart: true }),
  'Lobby (blocked)': () => ui.showLobby(cards, { note: 'CPU rivals are off: two or more seats need to join.', canStart: false }),
  HUD: () => { ui.hideAll(); hud(); ui.hint('Hold your phone flat like a tray'); },
  Down: () => { ui.hideAll(); hud({ seats: seats({ 1: { state: 'out' } }) }); },
  '2 seats': () => { ui.hideAll(); hud({ seats: seats({ 2: null, 3: null }) }); },
  Storm: () => { ui.hideAll(); hud({ storm: true, timeLeft: 24 }); },
  Sudden: () => { ui.hideAll(); hud({ sudden: true, timeLeft: 0 }); },
  Pause: () => ui.showPause(true),
  Results: () => ui.showResults({ ranking: [0, 2, 1, 3], names, colors, scores: [5, 3, 4, 1] }),
  Count: () => ui.countdown(3), Go: () => ui.countdown('GO'),
  'STORM banner': () => ui.banner('BARN STORM', 'storm'), 'SUDDEN': () => ui.banner('SUDDEN DEATH', 'storm'), 'TIME': () => ui.banner('TIME!', 'ko'),
  'KO P2': () => ui.callout(1, 'KO!'), 'OOPS P3': () => ui.callout(2, 'OOPS'), CLASH: () => ui.callout(-1, 'CLASH'),
  Hide: () => { ui.hideAll(); ui.hud(null); },
};
for (const [k, f] of Object.entries(steps)) { const b = document.createElement('button'); b.textContent = k; b.onclick = f; document.getElementById('bar').append(b); }
steps.Title();
</script>
</body>
</html>
